<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>핑고핑고</title>
    <!-- 애드센스 사이트 확인(운영 주소 ktc-pingopingo.duckdns.org). 광고 스크립트는 아니다 — 광고 충전 제공자(#1037)가 생기면 그때 따로 -->
    <meta name="google-adsense-account" content="ca-pub-3092224486214226" />
    <!-- 초대 링크를 카톡에 붙였을 때 보이는 미리보기. og:image 는 절대 주소여야 해서 운영 주소를 적는다(#1224, 그림은 public/og-image.png). -->
    <meta name="description" content="친구들과 한 지도에 가고 싶은 곳을 찍고, 의견을 모아 여행 장소를 정해요" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="핑고핑고" />
    <meta property="og:title" content="핑고핑고 — 같이 갈 곳을 한 지도에 모아요" />
    <meta property="og:description" content="친구들과 한 지도에 가고 싶은 곳을 찍고, 의견을 모아 여행 장소를 정해요" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://ktc-pingopingo.duckdns.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="핑고핑고 워드마크와 지도 위를 날아가는 펭귄 핑고" />
    <!-- 모바일 브라우저 주소창 색 — 지도 화면 위 컨트롤 면과 이어지게. 다크면 theme.ts 가 바꾼다. -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 화면 모드(#1412)를 그리기 전에 정한다 — 늦으면 다크 사용자에게 흰 화면이 한 번 번쩍인다. 규칙은 src/features/shell/theme.ts applyTheme 와 같다. -->
    <script>
      try {
        var c = localStorage.getItem('pingo-theme')
        var d = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 연다(#1493). 아이콘은 파랑 바탕 흰 핑고, 오프라인 캐시는 두지 않는다. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 검색과 AI 답변 엔진이 읽는 서비스 요약(#1614). 크레딧은 판매 상품이 아니라 무료다(기획안 16-4절). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "핑고핑고",
        "url": "https://ktc-pingopingo.duckdns.org/",
        "description": "친구들과 한 지도에 가고 싶은 곳을 찍고, 의견을 모아 여행 장소를 정해요",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "ko",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- JS를 돌리지 않는 크롤러(네이버, AI 크롤러)가 읽는 소개다(#1614). React가 뜨면 이 자리를 덮어쓴다.
           기능 줄은 src/features/onboarding/features.ts 의 text 와 같아야 한다(features.test.ts 가 대조한다). -->
      <main class="mx-auto max-w-[400px] px-5 pt-14">
        <h1 class="text-2xl font-bold text-ink-900">핑고핑고</h1>
        <p class="mt-1 font-semibold text-ink-900">같이 갈 곳을 한 지도에 모아요</p>
        <p class="mt-4 break-keep text-sm text-ink-700">친구들과 한 지도에 가고 싶은 곳을 찍고, 의견을 모아 여행 장소를 정해요</p>
        <h2 class="mt-8 text-sm font-bold text-ink-900">핑고핑고로 이런 걸 할 수 있어요</h2>
        <ul class="mt-4 space-y-3 break-keep text-sm text-ink-700">
          <li>가고 싶은 곳을 핀으로 남겨요</li>
          <li>좋음과 반대로 솔직한 의견을 나눠요</li>
          <li>모두의 취향을 모아 AI가 대안을 찾아줘요</li>
          <li>마음에 드는 장소는 확정 리스트에 담아요</li>
        </ul>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
