openapi: 3.1.0
info:
  title: pingo API
  version: 0.1.0
  description: |
    여행 공동 지도 API 계약. 정본은 이 파일이며 `최종기획안.md`의 절 번호를 각 엔드포인트 설명에 인용한다.
    변경 시 반드시 docs/CHANGELOG-api.md에 기록하고 프론트 담당자에게 통보한다 (CLAUDE.md 참고).
    security가 전역이므로 모든 엔드포인트는 401 UNAUTHORIZED를 반환할 수 있다.
    개별 엔드포인트에는 그 엔드포인트 고유의 에러만 명시한다.
servers:
  - url: https://api.pingo.example.com
    description: 배포 시 Cloud Run URL로 교체

security:
  - cookieAuth: []

tags:
  - name: auth
  - name: maps
  - name: pins
  - name: places
    description: 지도 API 이름 검색(핀 만들기 전 단계). 결과는 저장하지 않는다 — v1은 카카오 하나만 켠다(2026-10-01)
  - name: recommend
  - name: shortlist
  - name: realtime
    description: 서버→클라이언트 SSE 채널. 이벤트 페이로드의 정본은 docs/events.md
  - name: notifications
    description: 앱 안 알림함과 알림 설정(#470). 푸시·이메일은 없다 — 화면이 열릴 때와 알림함을 열 때 불러온다
  - name: feedback
    description: 서비스 피드백(#10, v2). 저장만 한다
  - name: ads
    description: 추천 탭 광고(docs/ads.md, #642). 자체 DB 장소만, 추천 후보와 순위에 들어가지 않는다. 노출과 클릭은 광고별 날짜별 집계만 남긴다
  - name: course
    description: AI 코스 짜기(동선 에이전트, #334). 확정 리스트를 날짜별 방문 순서로 짠다 — 계산은 코드가, 요청 한 줄의 해석은 모델이 한다(모델 호출 범위는 #580 결정). 질문에 답하는 API는 없다(엔진이 답이 없으면 기본값으로 이어 간다)
  - name: agent
    description: v2 계획 보조 에이전트(docs/agent-v2.md). 지도를 관찰해 막힌 곳에 제안을 내지만 아무것도 직접 실행하지 않는다. 엔드포인트 5개는 #531에서 구현(코드 유형 제안부터 노출), 추천 막힘 조언은 M2

paths:
  # ---------- auth ----------
  /auth/kakao/login:
    get:
      tags: [auth]
      summary: 로그인 시작 (#128). state를 만들어 카카오 인가 화면으로 302. 브라우저를 이 주소로 **이동**시킨다(fetch 아님)
      description: |
        로그인 CSRF를 막으려고 서버가 `state`를 만들어 서명한 httpOnly 쿠키(`kakao_oauth_state`, 경로 `/auth/kakao`, 10분)에 넣고
        같은 값을 붙여 카카오 인가 URL로 보낸다. 콜백이 그 쿠키와 `state`를 대조한다. 프론트는 카카오 인가 URL을 직접 만들지 않는다 —
        `${VITE_API_BASE_URL}/auth/kakao/login`으로 `window.location`을 옮기기만 한다(client_id·redirect_uri를 프론트가 알 필요가 없다).
        **게스트가 카카오로 전환할 때(#560, 2026-10-20)**: 게스트 세션 쿠키가 붙은 채로 이 주소로 이동하면 서버가 그 게스트 계정을 서명한 state 쿠키에 함께 담는다
        (프론트가 따로 할 일은 없다 — 게스트 화면의 「카카오로 계정 만들기」 버튼이 같은 주소로 이동하기만 하면 된다). 콜백이 카카오 로그인에 성공하면 **게스트 계정의 기록을 그 카카오 계정으로 합친다**(`docs/data-model.md`「게스트 합치기」).
      security: []  # 로그인 전 경로
      responses:
        "302": { description: "카카오 인가 화면(`https://kauth.kakao.com/oauth/authorize?...&state=...`)으로 리다이렉트. `Set-Cookie: kakao_oauth_state`" }

  /auth/kakao/callback:
    get:
      tags: [auth]
      summary: 카카오 OAuth 콜백. httpOnly 쿠키 발급 (13절 "토큰을 프론트에 두지 않는다")
      security: []  # 로그인 전 콜백이라 전역 cookieAuth가 적용되면 안 된다(PR #71 멘토 리뷰 대응)
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
          description: "카카오가 준 인가 코드. 사용자가 카카오 화면에서 취소하면 없고 error가 대신 온다(2026-10-04부터 선택)"
        - name: state
          in: query
          required: false
          schema: { type: string }
          description: "로그인 시작 때 서버가 만든 값을 카카오가 그대로 돌려준다. 쿠키와 다르거나 없으면 실패(`login_error=invalid_state`)"
        - name: error
          in: query
          required: false
          schema: { type: string }
          description: "카카오가 실패·취소 때 붙이는 값(예: access_denied). 있으면 로그인하지 않고 `login_error=cancelled`로 돌려보낸다"
      responses:
        "302":
          description: |
            **성공이든 실패든 항상 302다** — 이 경로는 fetch가 아니라 브라우저 이동이라 JSON을 돌려주면 사용자가 그대로 본다(2026-10-04).
            성공: 진입점(`FRONTEND_LOGIN_REDIRECT_URL`)으로, 세션 쿠키와 함께.
            **게스트 전환이었으면(#560, #694)** 같은 주소에 쿼리 `guest_merged=true`(게스트 기록이 카카오 계정으로 이어졌다) 또는 `guest_merged=false`(잇지 못했다 — 카카오 로그인은 성공했고 게스트 기록은 그대로 남아 있다. 사용자에게 알리고, 게스트 쿠키는 이미 카카오 세션으로 바뀌었으니 다시 하지 않는다)를 붙인다. 처음 쓰는 카카오 계정이면 게스트 계정에 카카오 로그인을 붙여 사용자 id와 표시 이름이 그대로이고, 이미 쓰던 카카오 계정이면 그 계정으로 기록을 옮긴다(이름은 그 계정 것). 게스트가 아닌 로그인에는 붙이지 않는다.
            실패: 같은 주소에 쿼리 `?login_error=<값>`을 붙여 돌려보내고 세션 쿠키는 만들지 않는다. state 쿠키는 성공·실패 모두 지운다.
            `login_error` 값: `cancelled`(사용자가 카카오 화면에서 취소), `invalid_state`(state 쿠키와 다르거나 없음 — 처음부터 다시), `kakao_failed`(카카오 토큰 교환·프로필 조회 실패), `server_error`(그 밖의 실패).

  /auth/guest:
    post:
      tags: [auth]
      summary: |
        게스트로 참여 — 이름만 입력하는 임시 계정 (#472, v2). 로그인 전에 호출하고, 초대 토큰으로 **그 지도에 바로 들어간다**(계정 생성과 초대 수락이 한 요청이다).
        응답에 세션 쿠키가 실린다(카카오 로그인과 같은 httpOnly 쿠키). 이미 로그인한 상태면 호출하지 않는다.
        - 게스트는 `User.is_guest=true`다. 지도를 **만들 수 없다**(`POST /maps` → 403 `GUEST_NOT_ALLOWED`). 방장이 될 수도 없다(나가기·탈퇴 위임의 후임으로 뽑히지 않고, 직접 넘기기 대상이면 422 `OWNER_TARGET_INVALID`).
        - 그 밖의 구성원 행동(핀·반응·추천·확정 리스트·초대 수락)은 일반 구성원과 같고 **같은 상한**이 걸린다(추천 10회 등).
        - 어뷰즈 방어: 초대 토큰 하나로 만들 수 있는 게스트는 최대 10명(초과 시 409 `GUEST_LIMIT`), IP·시간당 호출 상한(429 `RATE_LIMITED`).
        - 만료·꺼진 초대 토큰은 초대 수락과 같은 에러(404 `INVITE_NOT_FOUND`, 410 `INVITE_EXPIRED`·`INVITE_REVOKED`). 그 지도가 이미 20개 상한이면 해당 없음(게스트는 새 계정이라 0개에서 시작).
        - 세션은 30일, 90일 동안 쓰지 않은 게스트 계정은 정리 작업(#168)이 지운다. 탈퇴·삭제 규칙은 일반 사용자와 같다.
        - **카카오 계정으로 합치기(claim)는 이 스펙에 없다** — 별도 이슈로 나눈다(합치는 규칙이 모듈 여럿에 걸친다).
      security: []   # 로그인 전에 부르는 API라 전역 cookieAuth가 적용되면 안 된다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestJoinRequest" }
      responses:
        "201":
          description: 게스트 계정을 만들고 지도에 들어갔다. `Set-Cookie`로 세션 발급
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestJoinResult" }
        "404": { $ref: "#/components/responses/InviteNotFound" }
        "409": { description: "GUEST_LIMIT — 이 초대 링크로 만들 수 있는 게스트 수(10)를 넘었다", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { $ref: "#/components/responses/InviteGone" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 이름이 비었거나 50자 초과", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [auth]
      summary: 내 표시 이름 수정 — 계정 단위(모든 지도에 같은 이름, 2026-09-30). 지도마다 다른 이름은 두지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: VALIDATION_ERROR — display_name이 비었거나 50자 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      responses: { "204": { description: 로그아웃됨 } }

  /auth/withdraw:
    post:
      tags: [auth]
      summary: |
        탈퇴 (12절, #155 결정). users 행은 soft delete, 반응·반대 사유·근거 줄은 삭제한다.
        그 사람이 찍은 핀과 확정 리스트 항목은 남고, 작성자(created_by_display_name)는 "탈퇴한 구성원"으로 내려간다.
      responses: { "204": { description: 탈퇴 처리됨 } }

  # ---------- maps ----------
  /maps:
    get:
      tags: [maps]
      summary: 내 지도 목록 — 내가 구성원인 지도, 최근 생성순. 로그인 직후 진입점 (#24, 기획안 6절). 삭제된 지도와 내가 나간 지도는 빠진다 (#369). 목록의 Map에는 next_owner를 채우지 않는다. 지도 상한은 응답의 `limit`으로 내려 준다(#623). 화면은 상한 숫자를 들고 있지 않는다
      responses:
        "200":
          description: OK. 속한 지도가 없으면 items는 빈 배열
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapList" }
    post:
      tags: [maps]
      summary: 지도 생성. 생성 시 seeding 잡을 트리거한다 (architecture.md 3절). 내 지도(만들거나 참여한 지도, 삭제·나간 지도 제외)가 이미 20개면 409 MAP_LIMIT (#369, #433에서 10→20)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "409": { $ref: "#/components/responses/MapLimit" }

  /maps/{mapId}:
    get:
      tags: [maps]
      summary: 지도 상세 조회. 삭제된 지도는 404 (#369). 상세에서만 next_owner를 채운다
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [maps]
      summary: |
        지도 제목·날짜·지역 수정 — 방장만 (#465, docs/permissions.md map.settings.edit). 보낸 필드만 바꾼다(부분 수정).
        검증은 생성과 같다(제목 1~100자, 종료일은 시작일 이후, 지역은 label·lat·lng 함께). 둘 중 하나만 보내도 합친 결과로 검사한다.
        지역을 지우는 것은 지원하지 않는다(바꾸기만). 이미 실행된 추천 결과는 건드리지 않는다. 전체 채널에 map.updated를 보낸다(docs/events.md).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapUpdateRequest" }
      responses:
        "200":
          description: 수정됨. 요청자 기준 Map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 제목 길이, 종료일이 시작일보다 앞, 지역 필드 누락", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [maps]
      summary: |
        지도 삭제 — 방장만 (#369, docs/permissions.md map.delete). soft delete라 모든 구성원에게서 사라진다.
        이후 이 지도와 지도에 딸린 모든 경로, 이 지도의 초대 토큰은 404다. 전체 채널에 map.deleted를 보낸다(docs/events.md).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maps/{mapId}/members/me:
    delete:
      tags: [maps]
      summary: |
        지도 나가기 — 구성원 누구나 (#369, docs/permissions.md map.leave). 내 멤버십을 지우고, 내가 이 지도에 남긴 반응과
        근거 줄만 지운다. 핀, 확정 리스트 항목, 초대 링크, 추천 run과 후보는 남는다. 내가 찍은 핀의 작성자는 '나간 구성원'으로 보인다.
        방장이 나가면 joined_at이 가장 빠른 구성원(탈퇴자 제외)에게 방장이 넘어간다. 넘길 사람이 없으면 409 OWNER_CANNOT_LEAVE.
        전체 채널에 member.left를 보낸다(docs/events.md). 경로를 members/me로 둔 것은 v2 강퇴(#8)가 members/{userId}를 쓰기 위해서다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "204": { description: 나감 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/OwnerCannotLeave" }

  /maps/{mapId}/owner:
    post:
      tags: [maps]
      summary: |
        방장 직접 넘기기 — 방장만 (#468, docs/permissions.md owner.transfer). 대상은 지금 구성원이고 탈퇴하지 않았으며 나 자신이 아니어야 한다.
        넘긴 뒤 나는 member가 되고 지도에 남는다(나가기가 아니다). 전체 채널에 owner.changed를 보낸다(docs/events.md).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerTransferRequest" }
      responses:
        "200":
          description: 넘김. 요청자(이제 구성원) 기준 Map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/OwnerTargetInvalid" }

  /maps/{mapId}/invite:
    post:
      tags: [maps]
      summary: |
        초대 링크 발급 — 구성원 누구나 (#4, docs/permissions.md invite.create).
        **내가 이 지도에 만든 링크 중 아직 유효한(끄지 않았고 만료 전인) 것이 있으면 새로 만들지 않고 그것을 돌려준다**(#467, 멘토 리뷰의 토큰 증가 방지).
        그 경우도 응답은 201이 아니라 200이다. 남이 만든 링크는 재사용하지 않는다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: 내가 만든 유효한 링크가 이미 있어 그것을 돌려줌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "201":
          description: 새로 만듦
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maps/{mapId}/invites:
    get:
      tags: [maps]
      summary: 지도의 유효한 초대 링크 목록 — 방장만 (#467, docs/permissions.md invite.revoke). 끈 링크와 만료된 링크는 빠진다. 만든 시각 최신순
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /invites/{token}:
    get:
      tags: [maps]
      summary: |
        초대 요약 — 수락 화면(C-1/C-2)이 수락 전에 지도를 보여주기 위한 조회. 로그인 없이 호출할 수 있다(#23 "로그인 전엔 읽기만").
        토큰이 곧 접근 권한이므로 제목·기간·구성원 수·초대자 이름만 돌려주고 핀 등 지도 내용은 주지 않는다.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteSummary" }
        "404": { $ref: "#/components/responses/InviteNotFound" }
        "410": { $ref: "#/components/responses/InviteGone" }
    delete:
      tags: [maps]
      summary: |
        초대 링크 끄기 — 그 지도의 방장만 (#467, docs/permissions.md invite.revoke). 이미 끈 링크를 다시 꺼도 204다(멱등).
        끈 뒤에는 요약 조회·수락이 410 INVITE_REVOKED다. 이미 참여한 사람은 그대로 남는다.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 꺼짐 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InviteNotFound" }

  /invites/{token}/accept:
    post:
      tags: [maps]
      summary: 초대 수락. 로그인 전 접근 시 처리 방식은 결정 이슈 미결 (#15 분리분). 이름만 입력해 들어가려면 POST /auth/guest(#472). 내 지도가 이미 20개면 409 MAP_LIMIT(#369, #433). 이미 구성원인 지도의 초대를 다시 수락하는 경우는 새로 참여하는 게 아니라 막지 않는다
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/InviteNotFound" }
        "409": { $ref: "#/components/responses/MapLimit" }
        "410": { $ref: "#/components/responses/InviteGone" }

  /maps/{mapId}/members:
    get:
      tags: [maps]
      summary: |
        구성원 목록 (color, online) — 5절 "구성원 배지 + 목록". **지금 구성원만** 돌려준다 — 나간 사람과 탈퇴한 사람은 없다.
        그래서 이 목록의 길이는 `Map.member_count`와 항상 같다(#439, 멘토 리뷰 PR #380).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- places ----------
  /places/search:
    get:
      tags: [places]
      summary: |
        장소 이름 검색 (#180, #147 — v1 핀 입력 경로 ①). 검색바에서 이름을 치면 후보를 돌려주고, 사용자가 하나를 골라
        `POST /maps/{mapId}/pins`(source: search)로 핀을 만든다. 결과는 서버 DB에 저장하지 않는다(메모리 캐시만, #53).
        **결과는 화면에 보여 주기만 하고 서버는 저장하지 않는다**(카카오 약관, #53) — 핀을 만들 때 "매칭 힌트"로 되돌려 보내면 서버가 같은 자체 DB 장소를 찾는다(POST /maps/{mapId}/pins).
        결과에서 자체 DB 장소(`pinnable=true`)가 먼저 오고, 각 묶음 안은 카카오가 준 순서 그대로다.
        결과가 0개면 빈 배열 그대로다 — 지어내서 채우지 않는다 (가드레일 2). 로그인만 필요하고 지도 구성원 여부는 보지 않는다.
        지도 API가 모두 실패하면 503 PLACES_UNAVAILABLE. 외부 지도 API의 일일 쿼터를 지키려고 사용자당 호출 상한이 있다(초과 시 429 RATE_LIMITED, 상한 값은 서버 설정 — 기본 분당 30회). FE는 입력 debounce 300ms 이상으로 부르고 Enter/선택 시점에만 부르는 걸 권한다.
      parameters:
        - name: q
          in: query
          required: true
          description: "검색어. 앞뒤 공백을 걷은 뒤 1~50자"
          schema: { type: string, minLength: 1, maxLength: 50 }
        - name: lat
          in: query
          description: "이 좌표에 가까운 순으로 정렬한다(현재 지도 중심 등, 반경 제한은 없다). 없으면 관련도 순. lat·lng는 함께 보낸다"
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: limit
          in: query
          description: "최대 결과 수 (기본 10)"
          schema: { type: integer, minimum: 1, maximum: 15, default: 10 }
      responses:
        "200":
          description: OK. 관련도/거리 순. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaceSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: VALIDATION_ERROR — q가 비었거나 50자 초과, lat·lng 중 하나만 옴
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlacesUnavailable" }

  # ---------- pins ----------
  /categories/{category}/reason-chips:
    get:
      tags: [pins]
      summary: 카테고리별 반대 사유 칩 목록 (#60). 고정 목록이라 지도와 무관하다 — 로그인만 필요하다
      description: "해당 카테고리 칩 다음에 모든 카테고리 공통 칩이 온다. 반응할 수 없는 카테고리(숙소·기타)는 빈 배열"
      parameters:
        - { name: category, in: path, required: true, schema: { $ref: "#/components/schemas/Category" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReasonChip" }

  /places/nearest:
    get:
      tags: [places]
      summary: |
        지도를 눌러 핀 — 누른 자리에서 가장 가까운 **자체 DB 장소** (#473, 2026-10-13 결정). 반경 100m 안의 핀으로 만들 수 있는 장소(자체 DB)를
        가까운 순 최대 5곳 돌려준다. 카카오 응답을 쓰지 않는다. **누른 좌표(lat·lng)는 저장도 로깅도 하지 않는다**(카카오 약관, #53) — 이 요청에서 쓰고 버린다.
        고른 장소는 `POST /maps/{mapId}/pins`의 `source: search`로 만든다(결과의 place_id·place_name·lat·lng·category를 그대로 보낸다 — 자체 DB 장소의
        id가 매칭 힌트로 통해야 한다). 결과가 없으면 빈 배열 — 지어내지 않는다(가드레일 2). 화면은 이때 「검색으로 남기기」를 안내한다.
        로그인만 필요하다. 사용자당 호출 상한이 있다(초과 시 429 RATE_LIMITED, GET /places/search와 같은 상한을 쓴다).
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: category
          in: query
          description: "있으면 그 분류만. 음식점·카페·관광지"
          schema: { $ref: "#/components/schemas/Category" }
      responses:
        "200":
          description: OK. 모두 pinnable=true. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/PlaceSearchResult" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/PlacesUnavailable" }

  /places/from-link:
    post:
      tags: [places]
      summary: |
        지도 링크 해석 (#474, #134 결정 2026-10-13: 구글맵 + 카카오맵, 네이버·인스타·블로그 제외). 사용자가 붙여넣은 링크에서 장소를 알아낼 단서만 돌려주며
        **핀을 만들지 않고 아무것도 저장하지 않는다**. 핀은 아래 안내대로 기존 `POST /maps/{mapId}/pins`로 만든다. 모델을 쓰지 않는다(코드 해석).
        - **구글맵**(`google.com/maps/place/이름/@위도,경도`, `maps.app.goo.gl`·`goo.gl/maps` 단축 링크): 링크에 든 이름(`name_hint`)과 좌표로 반경 100m 안
          자체 DB 장소(`matches`, 가까운 순 최대 5)를 찾는다. 있으면 그것으로 `source: search` 핀. 없으면 화면이 `name_hint`로 GET /places/search를 열어 이어 간다.
        - **카카오맵**(`place.map.kakao.com/{id}`, `map.kakao.com/?itemId={id}`, `kko.to` 단축 링크): 장소 ID(`kakao_place_id`)만 뽑는다. 카카오 응답을 가져오지 않으므로
          이름·좌표는 모른다. 자체 DB에 그 카카오 ID로 매칭된 장소가 있으면 `matches`에 담고, 없으면 `needs_search_query=true` — 화면이 사용자에게 장소 이름(검색어)을 직접
          입력받아 `source: live`(kakao_place_id + search_query)로 핀을 남긴다.
        단축 링크는 서버가 리다이렉트를 따라가 해석한다(허용 호스트만, 리다이렉트 상한·타임아웃·사설 IP 차단, SSRF 방어). 응답에 링크 안의 좌표를 싣지 않는다(`name_hint`만).
        로그인만 필요하다. 사용자당 호출 상한이 있다(429 RATE_LIMITED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkParseRequest" }
      responses:
        "200":
          description: 해석됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkParseResult" }
        "422": { description: "LINK_NOT_SUPPORTED(허용 호스트가 아니거나 형식을 모름 — 네이버·인스타·블로그 포함) 또는 LINK_UNRESOLVED(단축 링크를 열지 못했거나 링크에서 장소를 못 찾음)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /maps/{mapId}/pins:
    get:
      tags: [pins]
      summary: 핀 목록. 지도의 삭제되지 않은 핀 전부 (비공개 후보는 핀이 아니라 후보라 여기 없다, 5-5-1)
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PinKind" }
        - name: created_by
          in: query
          description: "구성원별 핀 필터 (#26). 여러 명을 지정하면 OR로 묶는다"
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pin" }
    post:
      tags: [pins]
      summary: |
        핀 생성 (#191, 2026-10-01 결정, #382로 확장). 경로는 둘이다.

        **`source: search`(자체 DB 장소)**: GET /places/search 결과를 골라 `place_id`·`place_name`·`lat`·`lng`·`category`를 그대로 보내면, 서버가 **그것과 같은 자체 DB 장소를 한 건 찾아**
        그 장소의 이름·좌표만 핀에 쓴다. 요청의 `place_id`(카카오 장소 ID)·`place_name`·`lat`·`lng`는 **매칭 힌트일 뿐 저장하지 않는다**
        (카카오 장소 ID와 `place_url`만 매칭된 자체 DB 장소에 함께 기록된다). 짝이 되는 자체 DB 장소가 없으면 이 경로는 422 `PLACE_NOT_SUPPORTED`다 —
        화면은 이때 아래 `live`로 다시 보내 「그래도 핀 남기기」를 열 수 있다. 응답의 `category`는 장소의 분류이며, 요청 `category`가 다르면 422 `VALIDATION_ERROR`.
        자체 DB는 음식점·카페·관광지만 담는다(TourAPI 숙박은 받지 않는다, 2026-10-01).

        **`source: live`(실시간 핀, #382)**: 자체 DB에 없는 장소를 사람이 핀으로 남긴다. 서버는 **카카오 장소 ID(`kakao_place_id`), 사용자가 친 검색어(`search_query`),
        사용자가 쓴 메모(`memo`), 카테고리**만 저장하고 **이름·좌표는 저장하지 않는다**(카카오 응답의 이름·좌표·주소는 저장 불가, #53). 화면은 지도를 열 때마다
        카카오 JS SDK 키워드 검색으로 `search_query`를 다시 찾고 결과 중 장소 ID가 같은 것의 이름·좌표를 그 자리에서만 쓴다(서버로 보내지 않는다). 응답 `Pin`에는 `lat`·`lng`·`place_name`이 없다.
        같은 지도에서 같은 `kakao_place_id`의 핀이 이미 있으면 409 `PIN_DUPLICATE`다. 숙소·기타 카테고리는 live로도 만들 수 없다(422 `VALIDATION_ERROR`).
        live 핀은 반응·사유·필터·확정 리스트·삭제는 되지만 장소 정보·조건별 체크가 없고, AI 후보와 추천 검색 범위 기준점이 될 수 없으며, 서버가 좌표를 모르므로 동선 계산에서 빠진다(확정 리스트 항목의 `pin.source`가 live인 것 — FE가 "위치를 몰라 동선에서 빠졌어요"를 안내한다).

        `source: coordinate`(지도 길게 눌러 찍기)와 `source: link`는 v1에서 받지 않는다(422 `VALIDATION_ERROR`) — 카카오 지도에서 사용자가 지정한 좌표는 저장할 수 없다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinCreateRequest" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "409": { $ref: "#/components/responses/PinDuplicate" }
        "422": { $ref: "#/components/responses/PlaceNotSupported" }

  /maps/{mapId}/pins/link-preview:
    post:
      tags: [pins]
      summary: |
        카톡 대화에서 뽑은 지도 링크 미리보기 (#9, 기획안 5-9, v2). **쓰기 없음** — 링크마다 해석(`POST /places/from-link`와 같은 규칙)하고, 그 장소가 **이 지도에 이미 있는지**를 붙여 돌려준다.
        **대화 내용은 서버로 보내지 않는다.** 화면이 붙여넣은 텍스트를 브라우저 안에서 정규식으로 스캔해 구글맵·카카오맵 링크만 뽑아 URL만 보낸다(네이버·인스타·블로그·그 밖은 항목이 `LINK_NOT_SUPPORTED`).
        한 번에 **최대 10개**다 — 화면이 50개까지 10개씩 나눠 보내며 진행을 보여 준다. 단축 링크 해제가 느릴 수 있어 서버가 병렬로 처리하고 요청 마감(약 15초)을 넘긴 항목은 `LINK_UNRESOLVED`로 둔다.
        항목마다 결과가 따로 온다(`items[i]`, `index`는 요청 `urls`의 순서) — 일부가 실패해도 요청은 200이다. 요청 형식 오류(빈 목록, 10개 초과, 2000자 초과)만 422.
        - `result.matches`가 있으면 그 장소로 `source: search` 핀(`bulk` 또는 `POST /maps/{mapId}/pins`). 없으면 구글 링크는 `result.name_hint`로 GET /places/search를 이어 가고, 카카오 링크는 `result.needs_search_query`(사용자가 이름을 입력해 `source: live`).
        - `already_pinned_pin_id`가 있으면 이미 지도에 있는 곳이다(자체 DB 핀이든 실시간 핀이든, #569와 같은 기준). 화면은 목록에서 빼고 "이미 있음"으로 보여 준다(가드레일 6).
        응답에 링크의 좌표·원문 URL을 싣지 않고 서버도 남기지 않는다. 지도 구성원 누구나(`pin.create`, 게스트 포함). 사용자당 URL 수 기준 호출 상한이 있다(초과 시 429 `RATE_LIMITED`, 기본 분당 60개).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkPreviewRequest" }
      responses:
        "200":
          description: 항목별 결과(일부가 실패해도 200)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreviewResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — urls가 비었거나 10개 초과, 한 URL이 2000자 초과", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /maps/{mapId}/pins/bulk:
    post:
      tags: [pins]
      summary: |
        핀 일괄 생성 (#9, 기획안 5-9, v2) — 미리보기 목록에서 사람이 고른 것을 한꺼번에 찍는다. 항목은 `POST /maps/{mapId}/pins`의 요청(`PinCreateRequest`, search 또는 live)과 **같다**.
        **항목마다 따로 처리**한다 — 일부가 중복·거절이어도 나머지는 만들어진다. 항목 하나의 규칙은 핀 생성과 같다(`PIN_DUPLICATE` 교차 중복 포함, `PLACE_NOT_SUPPORTED`, `VALIDATION_ERROR` 등을 항목의 `error.code`로 돌려준다).
        한 번에 **최대 30개**. 만들어진 핀마다 `pin.created` 이벤트를 보낸다. 같은 요청 안에서 같은 장소가 두 번 오면 뒤의 것이 `duplicate`다. 요청 형식 오류(빈 목록, 30개 초과)만 422다.
        지도 구성원 누구나(`pin.create`).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkPinRequest" }
      responses:
        "200":
          description: 항목별 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPinResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — pins가 비었거나 30개 초과", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /maps/{mapId}/counts:
    get:
      tags: [pins]
      summary: 분류 × 종류 이중 필터 집계 (기획안 4절)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilterCounts" }

  /pins/{pinId}:
    patch:
      tags: [pins]
      summary: |
        핀 메모·분류 수정 — 그 핀을 찍은 사람만 (#466, docs/permissions.md pin.edit). 보낸 필드만 바꾼다. 요청자별 가능 여부는 Pin.permissions.can_edit.
        - `memo`: 모든 핀. 빈 문자열이면 지운다. 200자 이하.
        - `category`: **live 핀만**(#382), 음식점·카페·관광지만. 자체 DB 핀의 분류는 장소가 정하므로 보내면 422. 이미 반응이 하나라도 있는 핀은 분류를 바꿀 수 없다(422) — 추천 준비 판정과 반응 칩이 분류별이라 의견이 엉킨다.
        - **AI 추천 핀(kind=AI추천)과 확정 핀은 수정할 수 없다**(403, can_edit=false). 근거·체크·장소 값은 어떤 핀에서도 바꿀 수 없다. `kakao_place_id`·`search_query`도 바꿀 수 없다(다른 장소는 새 핀으로).
        전체 채널에 pin.updated(Pin)를 보낸다(docs/events.md).
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinUpdateRequest" }
      responses:
        "200":
          description: 수정됨. 요청자 기준 Pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 빈 객체, 메모 200자 초과, db 핀의 분류 변경, 반응이 있는 핀의 분류 변경, 숙소·기타", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [pins]
      summary: 핀 삭제 — 지도 구성원 누구나 (#25, 9/4 결정). 요청자별 가능 여부는 Pin.permissions.can_delete
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      responses: { "204": { description: 삭제됨 } }

  /pins/{pinId}/resolve:
    post:
      tags: [pins]
      summary: |
        실시간 핀 승격 — 자체 DB에 짝이 있으면 live 핀을 자체 DB 핀으로 바꾼다 (#501). 지도 구성원 누구나(`pin.resolve`).
        화면이 카카오 SDK로 그 핀의 이름·좌표를 찾았을 때(`kakao_place_id`로 다시 찾은 결과) **그 값을 매칭 힌트로만** 보낸다. 서버는 `POST /maps/{mapId}/pins`(source=search)와 같은 규칙(반경·이름 유사도·주소 보조·분류 일치, 모호하면 거절)으로 자체 DB 장소를 찾는다.
        - **짝이 있으면**: 핀이 `source: db`가 되고 `place_id`가 채워진다(`Pin.place_name`·`lat`·`lng`·`place_url`을 장소에서 가져온다). `kakao_place_id`·`search_query`는 지운다. **반응·사유·확정 리스트 항목·핀 id는 그대로 유지**된다. 전체 채널에 `pin.updated(Pin)`를 보낸다.
        - **짝이 없으면**: 200 + 핀 그대로(`source: live` 유지). 이벤트도 없다. 화면은 데이터가 늘어난 뒤 다시 시도할 수 있다.
        - **이미 자체 DB 핀이면** 아무것도 하지 않고 200으로 핀을 그대로 돌려준다(화면이 호출을 아끼려 거르지만 호출해도 안전).
        - **같은 지도에 그 장소의 핀이 이미 있으면** 409 `PIN_DUPLICATE`(`detail.pin_id` = 이미 있는 핀). 자동 병합은 하지 않는다 — 두 핀의 반응·사유가 엉키므로 사람이 한쪽을 지운다.
        - AI 추천·확정 핀은 live가 아니므로 항상 변화 없이 200이다. 분류는 핀의 `category`를 쓴다(본문에 없다).
        - **힌트(`place_name`·`lat`·`lng`·`address`)는 저장하지도 로깅하지도 않는다**(카카오 약관). 응답에도 싣지 않는다.
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinResolveRequest" }
      responses:
        "200":
          description: 승격됐거나(source=db) 변화 없음(source=live). 요청자 기준 Pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "PIN_DUPLICATE — 그 장소의 핀이 이 지도에 이미 있다 (detail.pin_id)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 이름·좌표 누락, 범위 밖 좌표", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------- notifications / feedback (v2) ----------
  /me/notifications:
    get:
      tags: [notifications]
      summary: |
        내 알림함 (#470) — 최근순. 로그인만 필요하다(지도 구성원 여부와 무관, 나간 지도의 알림도 남아 있다).
        알림은 이벤트를 만든 **같은 트랜잭션**에서 수신자별로 기록된다. 내가 한 일의 알림은 나에게 만들지 않는다(자기 핀에 자기가 ♥를 남겨도 알림 없음).
        끈 종류(`GET /me/notification-prefs`)는 만들 때 거른다. 90일이 지난 알림은 삭제된다(#168 정리 작업).
        실시간 푸시는 없다 — FE는 앱을 열 때, 포커스가 돌아올 때, 알림함을 열 때 이 API를 부른다. `unread_count`로 종 모양 배지를 그린다.
        알림 문장(`message`)은 서버가 만든다. **반대 사유 원문·핀 메모는 싣지 않는다.**
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: "이전 응답의 `next_before`를 그대로 — 그보다 오래된 알림을 준다" }
        - { name: unread_only, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — limit 범위 밖", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/notifications/read:
    post:
      tags: [notifications]
      summary: |
        알림 읽음 처리 (#470) — `ids`를 주면 그 알림만, 생략하면 내 알림 전부. 멱등이다(이미 읽은 것·남의 알림 id·없는 id는 조용히 무시한다 — 존재를 알리지 않는다).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationReadRequest" }
      responses:
        "204": { description: 처리됨 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — ids가 100개 초과", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /me/notification-prefs:
    get:
      tags: [notifications]
      summary: 알림 설정 (#470) — 알림 종류 전부를 항상 돌려준다. 저장된 행이 없는 종류는 켜짐(기본값)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      summary: |
        알림 설정 바꾸기 (#470) — 보낸 종류만 바꾸고 나머지는 둔다. 응답은 바뀐 뒤의 전체 설정.
        끈다고 이미 쌓인 알림이 지워지지는 않는다. 앞으로 만들지 않을 뿐이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPrefsUpdate" }
      responses:
        "200":
          description: 바뀐 뒤의 전체 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 모르는 종류, 빈 목록", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /feedback:
    post:
      tags: [feedback]
      summary: |
        서비스 피드백 보내기 (#10, v2) — 로그인한 사용자 누구나. 저장만 하고 답장·알림은 없다.
        사용자당 호출 상한이 있다(초과 시 429 RATE_LIMITED, 서버 설정 — 기본 시간당 10건).
        내용은 사용자 입력이라 저장할 수 있다. 계정을 탈퇴하면 작성자 연결은 끊고 내용은 남긴다(운영 개선용).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "201":
          description: 저장됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: "검증 실패 (VALIDATION_ERROR) — 공백뿐인 내용, 1000자 초과", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /pins/{pinId}/reaction:
    put:
      tags: [pins]
      summary: |
        반응 등록/수정. 반대(against)는 reason 필수 (가드레일 3).
        숙소 핀은 반응을 받지 않는다(#154) — permissions.can_react=false이고 요청하면 422 REACTION_NOT_ALLOWED
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReactionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }
        "422":
          description: EVIDENCE_REQUIRED(반대 사유 없음, 가드레일 3), REACTION_NOT_ALLOWED(숙소·기타 핀, #154) 또는 VALIDATION_ERROR(그 카테고리 칩 목록에 없는 reason_chip_ids, #60)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [pins]
      summary: 내 반응 취소 (「의견 취소」) — 내가 남긴 반응만 지운다. 핀 상태는 되돌리지 않는다. 지울 반응이 없으면(숙소 핀 포함) 그대로 204
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      responses: { "204": { description: 반응 취소됨 } }

  /pins/{pinId}/reactions:
    get:
      tags: [pins]
      summary: 핀별 구성원 의견 목록 — 핀 상세 「구성원 의견」. 구성원 누구나 조회 (숙소 핀은 빈 배열)
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      responses:
        "200":
          description: OK. 반응한 구성원만 온다 (미응답자는 포함하지 않는다)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reaction" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- recommend (3절, 5-5~5-6-1) ----------
  /maps/{mapId}/recommend/readiness:
    get:
      tags: [recommend]
      summary: 카테고리별 추천 버튼 활성화 판정 (5-4). 키는 RecommendCategory 값만 온다 — 숙소는 추천 대상이 아니다 (#145)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                propertyNames: { $ref: "#/components/schemas/RecommendCategory" }
                additionalProperties: { $ref: "#/components/schemas/Readiness" }

  /maps/{mapId}/runs:
    get:
      tags: [recommend]
      summary: |
        지난 추천 기록 — **내가 요청한 run만** (#469, 가드레일 1: 대안은 요청한 사람에게만 보인다). 다른 구성원의 run은 이 목록에 없다. 최근 요청순.
        항목을 누르면 기존 `GET /runs/{runId}/result`로 결과를 다시 연다(그 run을 요청한 본인만, 아니면 403). 결과는 **마지막 시도**의 후보만 남아 있다
        (반경 넓히기·다시 추천 때 게시하지 않은 이전 후보는 교체된다). 지도 구성원이 아니면 404.
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - name: category
          in: query
          description: "있으면 그 분류의 run만"
          schema: { $ref: "#/components/schemas/RecommendCategory" }
        - name: limit
          in: query
          description: "가져올 개수. 기본 20, 최대 50"
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: OK. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [recommend]
      summary: run 생성 — 근거 조립 시작 (①②)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: "#/components/schemas/RecommendCategory" }
      responses:
        "202":
          description: run 생성됨, 근거 조립 진행 중 (SSE run.progress로 진행 상태 전달)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "409": { $ref: "#/components/responses/NotReady" }
        "429": { $ref: "#/components/responses/RetryLimit" }
        "500": { $ref: "#/components/responses/RecommendFailed" }

  /runs/{runId}/evidence:
    get:
      tags: [recommend]
      summary: 근거 리스트 조회 (5-5)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceLine" }
    patch:
      tags: [recommend]
      summary: |
        근거 토글('-') / 직접 추가('+') (5-5). '-'는 author 본인만 (permissions.md).
        '+'로 추가한 줄은 ②(사유 구조화)가 키와 방향을 붙여 선호(`badge: preferred`)가 된다. 순위 점수에만 반영되고 후보를 거르지 않는다(#707, ♥ 사유와 같은 규칙).
        한 요청에 글 5개까지(`add` maxItems, 넘으면 422 VALIDATION_ERROR), run 하나에 직접 추가한 글은 10개까지다(뺀 것도 센다, 넘으면 409 EVIDENCE_LIMIT). 상한은 모델을 부르기 전에 검사한다.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidencePatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceLine" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EvidenceLimit" }
        "500": { $ref: "#/components/responses/RecommendFailed" }  # 「+」로 직접 추가한 줄도 ②(사유 구조화)를 거친다 — 모델 호출이 실패하면(#254)

  /runs/{runId}/regions/confirm:
    post:
      tags: [recommend]
      summary: |
        지역 확인 (5-6-1). 사람이 쓴 반경 사유끼리 안 겹칠 때만 호출된다.
        signature가 이전과 같으면 재확인 없이 즉시 200. signature 변경(사유 수정/추가로 겹침 여부가 바뀜) 시에만 REGION_CONFLICT로 재확인 요구.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accept_union: { type: boolean, description: "두 지역 각각 찾기 선택 시 true" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
        "409": { $ref: "#/components/responses/RegionConflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/execute:
    post:
      tags: [recommend]
      summary: 「이대로 추천 받기」 — 실격 필터 + 선호 순위 실행 (③-a-2, ③-b, ④)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202":
          description: 실행 시작. 완료는 SSE run.progress(개인 채널) 또는 GET /runs/{id}/result 폴링
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "500": { $ref: "#/components/responses/RecommendFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/result:
    get:
      tags: [recommend]
      summary: 추천 결과 조회 (funnel, regions, candidates) — 5-6 깔때기 표시
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendResult" }
        "404": { $ref: "#/components/responses/NoResults" }
        "409": { description: "아직 끝나지 않았거나 실패한 run (RUN_NOT_FINISHED, #469) — status가 done일 때만 결과가 있다. 지난 추천 기록에서 여는 run에 쓴다", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { $ref: "#/components/responses/RecommendFailed" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/widen:
    post:
      tags: [recommend]
      summary: |
        반경 넓히기. 기본값 원만 확대한다 — 사람이 명시한 원(예 "숙소 기준 20분")은 자동으로 넓히지 않는다 (가드레일 4, 5-6-1).
        한 번 누를 때마다 기본값 원의 도보 시간을 5분씩 늘린다(기본 15분 → 20분 → 25분 → 30분). 상한은 도보 30분이며 넘으면 409 WIDEN_LIMIT.
        폭·상한은 docs/constraints.md의 조정 가능한 상수다 — 응답 RecommendRun에 현재 기본 반경(default_radius_walk_min)을 실어 화면이 "다음은 몇 분"을 안내한다.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202":
          description: 재실행 시작
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "409": { $ref: "#/components/responses/WidenLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/retry:
    post:
      tags: [recommend]
      summary: |
        「다시 추천 받기」. 현재 뜬 대안 전체를 제외목록에 넣고 새로 찾는다 (3절, 루프가 닫힌다).
        10회 상한(지도 안에서 구성원 각자, 카테고리 무관) 초과 시 429 RETRY_LIMIT (#31, 2026-10-15 5→10회). 응답의 attempt_no와 attempt_limit으로 현재 몇 번째인지 노출한다.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "429": { $ref: "#/components/responses/RetryLimit" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/advice:
    get:
      tags: [recommend]
      summary: |
        추천 막힘 조언 (v2, docs/agent-v2.md 9절) — 그 run을 요청한 본인만(recommend.manage). 실서버 구현 전(KNOWN_MISSING).
        결과가 3곳 미만이거나 같은 카테고리 run을 3번 이상 만든 완료 run에서, 더 많이 추천받는 방법을 알려 준다(반경 넓히기, 실격 조건 확인, 애매한 사유 고치기, 후보 소진 안내).
        run당 한 번만 만들고 저장한다 — 같은 run을 다시 열면 같은 조언이다. 대상이 아니거나 낼 조언이 없으면 204.
        FE는 깔때기를 먼저 보여 준 뒤 부르고, 기다리는 동안 조언 자리만 둔다(16.5). 버튼은 widen_radius, open_evidence 두 종류뿐이다.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: 조언
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAdvice" }
        "204": { description: 대상이 아니거나 낼 조언이 없음 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /candidates/{candidateId}/publish:
    post:
      tags: [recommend]
      summary: 「지도에 올리기」 — 비공개 후보를 전체 채널에 공개, 핀으로 전환 (5-5-1, 가드레일 1)
      parameters: [ { $ref: "#/components/parameters/CandidateId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "404": { $ref: "#/components/responses/AiPinPrivate" }
        "409": { description: "게시할 수 없다 — NOT_READY(run이 아직 done이 아니다) 또는 PIN_DUPLICATE(그 장소가 이미 지도에 있다, detail.pin_id)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------- shortlist (5-3, 5-10) ----------
  /maps/{mapId}/shortlist:
    get:
      tags: [shortlist]
      summary: 확정 리스트 조회
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShortlistItem" }
    post:
      tags: [shortlist]
      summary: 확정 추가 — 구성원 누구나 (5-3, 15-1)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pin_id]
              properties:
                pin_id: { type: string }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShortlistItem" }

  /shortlist/{itemId}:
    delete:
      tags: [shortlist]
      summary: 확정 제외
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses: { "204": { description: 제외됨 } }

  /maps/{mapId}/shortlist/export:
    get:
      tags: [shortlist]
      summary: |
        확정 리스트 내보내기 — 구성원 누구나 (#471). 확정 순서(`visit_order`, 없으면 추가한 순서)대로 한 줄씩 담은 텍스트(`txt`) 또는 CSV(`csv`)를 내려준다.
        열은 순서·이름·분류·카카오 링크·메모다. **실시간 핀(live)은 이름을 저장하지 않으므로**(#53) 이름 칸에 검색어를 쓰고 이름 뒤에 "(이름 확인 필요)"를 붙이며,
        링크 칸에는 `place.map.kakao.com/<id>` 링크를 넣는다. 자체 DB 핀은 장소 이름과 장소 페이지 링크를 쓴다. 좌표는 내보내지 않는다.
        CSV는 엑셀에서 한글이 깨지지 않게 UTF-8 BOM으로 시작한다. 확정 리스트가 비어 있으면 CSV는 머리글만, txt는 안내 한 줄이다.
        공개 공유 링크는 이 범위 밖이다.
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - name: format
          in: query
          description: "기본 txt"
          schema: { type: string, enum: [txt, csv], default: txt }
      responses:
        "200":
          description: "파일 내용. Content-Disposition 헤더(attachment)로 내려준다 — 응답은 JSON이 아니다"
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/plain:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "format이 txt·csv가 아님 (VALIDATION_ERROR)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /maps/{mapId}/shortlist/order:
    put:
      tags: [shortlist]
      summary: |
        확정 리스트 수동 정렬 (#30). 보기 좋게 순서를 바꾸는 것뿐이고 동선과는 무관하다.
        동선을 다시 짜려면 POST /maps/{mapId}/route를 부른다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  items: { type: string }
                  description: "원하는 순서대로 나열한 shortlist item id 전체"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShortlistItem" }
        "422": { description: "item_ids가 현재 확정 리스트와 맞지 않는다(VALIDATION_ERROR, detail에 불일치 항목)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /maps/{mapId}/route:
    get:
      tags: [shortlist]
      summary: |
        마지막으로 계산된 동선 조회 (5-10). 순수 계산, 모델 미사용.
        확정 핀이 여러 지역에 걸치면 지역별로 여러 동선을 반환한다.
        한 번도 계산하지 않았으면 빈 배열. 좌표가 없는 실시간 핀(`Pin.source=live`, #382)은 계산에서 빠지고 `ordered_pin_ids`에 들어가지 않는다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }
    post:
      tags: [shortlist]
      summary: |
        「동선 짜주기」 — 현재 확정 리스트로 동선을 계산한다 (#30, 기획안 5-10의 "동선 보기" 토글).
        확정 리스트가 바뀌어도 자동 재계산하지 않는다. 사람이 이 버튼을 눌러야 실행된다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: 계산된 동선. 같은 결과를 route.recalculated로도 발행한다
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }

  # ---------- ads (추천 탭 광고, docs/ads.md, #642) ----------
  /maps/{mapId}/ads:
    get:
      tags: [ads]
      summary: |
        추천 탭 하단 광고 — 구성원 누구나(새 권한 액션 없음). 화면 중심에서 반경 안의 진행 중인 광고를 최대 2개 고른다(코드, 모델 없음).
        요청자의 이 지도 최신 추천 결과에 있는 장소는 뺀다. 광고는 반응과 실격 필터를 거치지 않고, 추천 후보와 순위에 들어가지 않는다(docs/ads.md 2절).
        **응답에 실린 광고마다 노출(served_count)을 1 올린다.** 그래서 미리 불러오기를 하지 않고, 탭을 열 때와 카테고리를 바꿀 때만 부른다.
        카테고리가 없으면 추천 대상 카테고리 전체에서 고른다. 광고 장소를 지도에 올릴 때는 place의 place_id, name, lat, lng, category를 그대로 `POST /maps/{mapId}/pins`(source: search)로 보낸다
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - name: category
          in: query
          required: false
          description: "추천 대상 카테고리 중 하나. 없으면 전체"
          schema: { $ref: "#/components/schemas/RecommendCategory" }
        - name: lat
          in: query
          required: true
          description: "탭을 연 순간의 지도 화면 중심"
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: OK. 광고가 없으면 ads는 빈 배열이고 화면은 광고 영역을 그리지 않는다. 응답은 캐시하지 않는다(Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "category가 추천 대상이 아니거나 lat, lng가 범위 밖(VALIDATION_ERROR)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /ads/{adId}/clicks:
    post:
      tags: [ads]
      summary: |
        광고 클릭 기록 — 그 지도의 구성원(새 권한 액션 없음). 광고 칸에서 「카카오맵에서 보기」나 「지도에 올리기」를 누르면 보낸다.
        본문의 map_id는 권한 확인에만 쓰고 저장하지 않는다(집계는 광고별 날짜별 수만). 기간이 끝났거나 내린 광고도 행이 있으면 센다.
        실패해도 화면은 사용자에게 알리지 않는다
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdClickRequest" }
      responses:
        "204": { description: 기록함 }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "본문 형식 오류(VALIDATION_ERROR)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ---------- agent (v2 계획 보조 에이전트, docs/agent-v2.md) ----------
  # #531에서 구현. 모델 유형 제안(정체, 갈림)은 #534까지 shadow라 응답에 나오지 않는다. 에이전트는 아무것도 직접 실행하지 않는다 — 버튼은 사람이 원래 하던 동작의 지름길이다.
  /maps/{mapId}/agent:
    get:
      tags: [agent]
      summary: |
        「핑고 AI 조언」 바텀시트 상태 — 구성원 누구나 (docs/agent-v2.md 14절). 모드, 지금 제안(지도당 0개 또는 1개), 미열람 여부, 카테고리별 우리 조건 요약.
        문장은 모두 서버가 렌더한 것이다. FE는 슬롯이나 숫자를 다루지 않고 그대로 보여 준다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentState" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maps/{mapId}/agent/settings:
    put:
      tags: [agent]
      summary: |
        모드 켜고 끄기 — 구성원 누구나 (docs/permissions.md agent.toggle). 지도 단위이고 기본값은 켜짐이다.
        끄면 지금 제안을 무효화(superseded)한다. 전체 채널에 agent.settings_changed를 보낸다(끄면서 제안이 있었으면 agent.resolved도).
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettingsRequest" }
      responses:
        "200":
          description: 바뀐 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSettings" }
        "404": { $ref: "#/components/responses/NotFound" }

  /agent/suggestions/{suggestionId}/view:
    post:
      tags: [agent]
      summary: |
        열람 기록 — 구성원 누구나. 시트를 열어 제안이 화면에 보였을 때 부른다. 사람마다 한 번 기록되고(멱등) 버튼의 점(has_unseen)이 꺼진다.
        이벤트는 없다. 이미 처리된 제안도 204다.
      parameters: [ { $ref: "#/components/parameters/SuggestionId" } ]
      responses:
        "204": { description: 기록함 }
        "404": { $ref: "#/components/responses/NotFound" }

  /agent/suggestions/{suggestionId}/accept:
    post:
      tags: [agent]
      summary: |
        제안의 버튼 하나를 누름 — 구성원 누구나 (agent.suggestion.resolve). 서버는 제안을 accepted로 바꾸고 그 버튼의 동작 설명(`AgentAction`)을 돌려준다.
        **서버는 그 동작을 대신 실행하지 않는다.** FE가 응답의 action을 손으로 할 때와 같은 API로 실행한다(docs/agent-v2.md 16.3).
        이미 다른 사람이 처리했으면 409 SUGGESTION_RESOLVED — FE는 `GET /maps/{mapId}/agent`를 다시 받는다. 전체 채널에 agent.resolved를 보낸다.
      parameters: [ { $ref: "#/components/parameters/SuggestionId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAcceptRequest" }
      responses:
        "200":
          description: 수락함. FE가 실행할 동작
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentAcceptResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SuggestionResolved" }
        "422": { description: "action_index가 그 제안의 버튼 범위 밖 (VALIDATION_ERROR)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /agent/suggestions/{suggestionId}/dismiss:
    post:
      tags: [agent]
      summary: |
        제안 닫기 — 구성원 누구나 (agent.suggestion.resolve). 지도 단위라 모두에게서 닫힌다. 같은 종류 제안은 한동안(2, 6, 24시간) 다시 나오지 않는다.
        이미 처리됐으면 409 SUGGESTION_RESOLVED. 전체 채널에 agent.resolved를 보낸다.
      parameters: [ { $ref: "#/components/parameters/SuggestionId" } ]
      responses:
        "204": { description: 닫음 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SuggestionResolved" }

  # ---------- course (AI 코스 짜기, #334 · 모델 호출 결정 #580) ----------
  /maps/{mapId}/courses:
    post:
      tags: [course]
      summary: |
        「AI 코스 짜기」 요청 — 구성원 누구나(course.request). 확정 리스트를 지도 기간의 날짜별 방문 순서로 짠다.
        run을 queued로 저장하고 202를 돌려준다. 계산은 백그라운드에서 한다(보통 수 초에서 수십 초) — FE는 `GET /course-runs/{runId}`를 2초 간격으로 불러 status가 done이나 failed가 될 때까지 기다린다.
        코스는 요청한 본인에게만 보인다(가드레일 1). 확정 장소는 좌표를 아는 것만 센다(실시간 핀은 빠지고 excluded에 남는다). 한 번에 30곳까지, 여행 기간은 앞 14일까지 짠다.
        하루 상한은 사용자당 5번(KST 자정 초기화)이고 지도마다 내 진행 중 run은 하나다. request_text와 member_constraints는 모두 선택이다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseRequest" }
      responses:
        "202":
          description: 접수됨
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseRunCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CourseInProgress" }
        "422": { $ref: "#/components/responses/CourseNotEnoughPlaces" }
        "429": { $ref: "#/components/responses/CourseLimit" }

  /maps/{mapId}/courses/latest:
    get:
      tags: [course]
      summary: |
        내 마지막 코스 — 구성원 누구나(남의 코스는 내려가지 않는다). 진행 중인 run도 돌려주므로 화면을 다시 열면 이어서 기다릴 수 있다.
        짠 적이 없으면 204.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: 가장 최근에 요청한 run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseRun" }
        "204": { description: 아직 짠 코스가 없음 }
        "404": { $ref: "#/components/responses/NotFound" }

  /course-runs/{runId}:
    get:
      tags: [course]
      summary: |
        코스 run 하나 — 요청한 본인만(course.view). 비구성원 404, 요청자가 아닌 구성원 403.
        status가 queued·running이면 결과 칸(goals, days 등)은 비어 있고 steps만 단계가 생길 때마다 뒤로 늘어난다. done이면 모두 채워지고, failed면 failure_code와 그때까지의 steps만 있다.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- realtime (SSE, docs/events.md가 정본) ----------
  /maps/{mapId}/events:
    get:
      tags: [realtime]
      summary: |
        전체 채널 SSE. 지도의 모든 구성원이 구독한다.
        비공개 후보는 이 채널로 절대 내려가지 않는다 — 후보는 개인 채널(`/events/me`)로만 온다 (5-5-1, 가드레일 1).
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - { $ref: "#/components/parameters/LastEventId" }
      responses:
        "200":
          description: 전체 채널 이벤트 스트림
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PublicEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /maps/{mapId}/events/me:
    get:
      tags: [realtime]
      summary: |
        개인 채널 SSE. 요청자 본인만 구독한다. 본인의 비공개 AI 후보와 run 진행 상태가 여기로만 온다.
        채널 분리가 5-5-1을 if문이 아니라 구조로 강제한다.
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - { $ref: "#/components/parameters/LastEventId" }
      responses:
        "200":
          description: 개인 채널 이벤트 스트림
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PrivateEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    MapId: { name: mapId, in: path, required: true, schema: { type: string } }
    PinId: { name: pinId, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string } }
    SuggestionId: { name: suggestionId, in: path, required: true, schema: { type: string } }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        브라우저 EventSource가 재연결 시 자동으로 보낸다. 이 seq 이후 이벤트만 재전송한다.
        event_log 보존기간을 넘긴 값이면 REST 재조회로 폴백한다 (docs/events.md).
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PinDuplicate:
      description: 이미 지도에 있는 장소 (가드레일 6)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EvidenceRequired:
      description: 반대 반응에 사유가 없음 (가드레일 3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoResults:
      description: 필터 통과 후보 0개 (6절 "결과 0개")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlaceNotSupported:
      description: |
        핀을 만들 수 없다. 응답 본문의 `code`로 분기한다 — `PLACE_NOT_SUPPORTED`(`source: search`인데 짝이 되는 자체 DB 장소가 없음 — 화면은 `source: live`로 다시 보낼 수 있다, #382),
        `VALIDATION_ERROR`(필수 힌트 누락, `source`가 coordinate·link, 요청 `category`가 장소의 분류와 다름, live에 숙소·기타 카테고리)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 요청이 너무 잦다 — 잠시 뒤 다시 시도 (RATE_LIMITED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlacesUnavailable:
      description: 지도 API를 모두 쓸 수 없다(키 없음·장애·호출 상한) — 잠시 뒤 다시 시도 (PLACES_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteNotFound:
      description: 없거나 잘못된 초대 토큰 (INVITE_NOT_FOUND). 삭제된 지도의 토큰도 같다 (#369)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteExpired:
      description: 만료된 초대 토큰 (INVITE_EXPIRED)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteGone:
      description: 쓸 수 없는 초대 토큰 — 만료됐다(INVITE_EXPIRED) 또는 방장이 껐다(INVITE_REVOKED, #467). 코드로 구분한다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OwnerTargetInvalid:
      description: 방장을 넘길 수 없는 대상 (OWNER_TARGET_INVALID) — 지금 구성원이 아니거나 탈퇴했거나 나 자신 (#468)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SuggestionResolved:
      description: 이미 처리된 지도 제안 (SUGGESTION_RESOLVED, v2) — 다른 구성원이 먼저 수락하거나 닫았거나, 만료 또는 무효화됨. `GET /maps/{mapId}/agent`를 다시 받는다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WidenLimit:
      description: 기본값 원이 이미 상한(도보 30분) — 더 넓힐 수 없음 (WIDEN_LIMIT). 「근거 고치기」/「직접 찍기」로 안내
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RetryLimit:
      description: 재시도 상한(지도 안 구성원 각자 10회) 초과 (6절, #31, 2026-10-15 5→10회). detail.attempt_no, detail.attempt_limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegionConflict:
      description: 두 반경 사유가 겹치지 않음 — 사용자 확인 필요 (5-6-1)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AiPinPrivate:
      description: 「지도에 올리기」 전용 — 구성원이어도 요청자가 아닌 사람이 남의 후보를 게시하려 함. 후보의 존재를 숨기려고 404 `AI_PIN_PRIVATE`로 답한다. 후보가 없거나 비구성원이면 404 `NOT_FOUND` (5절 "비공개 AI 핀 접근 시 안내")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: 추천 준비 미달 — 해당 카테고리에 ♥/🚫 의견이 달린 핀이 하나도 없다 (5-4, 2026-10-07 #360. 예: "의견 핀 0곳 · 1곳 더 필요")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        권한 없는 액션 (docs/permissions.md 범위 밖).
        이 응답이 화면에 보이면 버튼이 애초에 disabled였어야 했다는 신호다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        존재하지 않거나(리소스 없음), 요청자가 그 지도의 구성원이 아님 (docs/permissions.md
        "권한을 어디서 강제하는가" — 비구성원에게 존재 여부 자체를 흘리지 않는다).
        삭제된 지도(#369)와 그 지도에 딸린 모든 리소스도 404다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MapLimit:
      description: 내 지도가 이미 20개다(#433에서 10→20) — 만들거나 참여한 지도 합산, 삭제된 지도와 나간 지도는 세지 않는다 (MAP_LIMIT, #369). detail에 { limit, count }. 지도를 나가거나 삭제하면 다시 할 수 있다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OwnerCannotLeave:
      description: 넘길 사람이 없는 방장은 나갈 수 없다 — 혼자이거나 남은 사람이 전부 탈퇴자 (OWNER_CANNOT_LEAVE, #369). 「지도 삭제」를 안내한다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecommendFailed:
      description: 추천 파이프라인 실패 (6절 "조건이 까다로워서가 아니에요")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CourseNotEnoughPlaces:
      description: 코스를 짤 확정 장소가 2곳 미만 (COURSE_NOT_ENOUGH_PLACES, #334). detail에 { min, count } — 좌표를 알 수 없는 실시간 핀은 세지 않는다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EvidenceLimit:
      description: run 하나에 직접 추가('+')한 글이 10개를 넘음(뺀 것 포함, EVIDENCE_LIMIT, #707). 글 하나에 조건이 여럿이면 근거 줄은 여럿이어도 글 1개로 센다. detail에 { limit, used }(글 수)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CourseLimit:
      description: 사용자당 하루 5번(KST 자정 초기화)을 넘김 (COURSE_LIMIT, #334). detail에 { limit, used }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CourseInProgress:
      description: 이 지도에서 내가 요청한 코스를 아직 짜는 중 (COURSE_IN_PROGRESS, #334). detail에 { course_run_id } — 그 run을 계속 기다린다
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: 동일 Idempotency-Key로 다른 바디를 보냄 — 재시도 로직 버그 신호. 붙일 엔드포인트는 #48 결정에 따름
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: 공통 에러 포맷. 코드 카탈로그는 docs/errors.md
      required: [code, message]
      properties:
        code: { type: string, example: "PIN_DUPLICATE" }
        message: { type: string }
        detail: { type: object, additionalProperties: true }

    Category:
      type: string
      description: "장소 카테고리 전체. 카테고리마다 핀을 만들 수 있는지, 반응할 수 있는지, 추천 대상인지는 backend/common/categories.py 한 곳에서 정하고 대조 테스트로 이 목록과 맞춘다(#280). v1은 음식점, 카페, 관광지만 핀을 만들 수 있다. 숙소와 기타는 자체 장소 DB에 없어 핀으로 만들 수 없고 값만 남아 있다(#191)"
      enum: [음식점, 카페, 숙소, 관광지, 기타]

    RecommendCategory:
      type: string
      description: "AI 대안 추천을 받을 수 있는 카테고리. backend/common/categories.py에서 추천 대상인 카테고리와 같아야 한다(대조 테스트, #280). 숙소는 추천 대상이 아니다(#145)"
      enum: [음식점, 카페, 관광지]

    PinKind:
      type: string
      enum: [일반, AI추천, 확정]
      description: 핀 종류는 이 3가지뿐 (기획안 9절). 확정이 나머지 둘을 덮어쓴다.

    Permissions:
      type: object
      description: 요청자 기준 계산된 권한. FE는 이 값만 보고 버튼을 그린다 (permissions.md)
      properties:
        can_react: { type: boolean }
        can_revert: { type: boolean }
        can_add_to_shortlist: { type: boolean }
        can_remove_from_shortlist: { type: boolean }
        can_disable: { type: boolean, description: "evidence_line 전용: 자기가 쓴 것만 true" }
        can_delete: { type: boolean, description: "pin: 핀 삭제. map: 지도 삭제, 방장만 true (#369)" }
        can_leave: { type: boolean, description: "map 전용: 지도 나가기. 넘길 사람이 없는 방장은 false (#369)" }
        can_publish: { type: boolean, description: "candidate 전용: recommend.publish — candidate.requested_by 본인만 true (#64)" }
        can_edit: { type: boolean, description: "map: 지도 제목·날짜·지역 수정(map.settings.edit), 방장만 true (#465). pin: 핀 메모·분류 수정(pin.edit), 그 핀을 찍은 사람만 true이고 AI 추천·확정 핀은 false (#466)" }

    User:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string, maxLength: 50 } # 코드에 근거 없음, 팀 확인 필요(멘토 리뷰 대응)
        is_guest: { type: boolean, description: "게스트(이름만 입력한 임시 계정, #472)면 true. 서버는 로그인 수단(카카오)이 없는 사용자를 게스트로 본다(#694). 없으면 false로 본다. 게스트는 지도를 만들 수 없다(POST /maps 403 GUEST_NOT_ALLOWED)" }

    GuestJoinRequest:
      type: object
      required: [display_name, invite_token]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 50, description: "게스트로 보일 이름. 앞뒤 공백을 지운 뒤 비어 있으면 422" }
        invite_token: { type: string, description: "들어갈 지도의 초대 토큰(GET /invites/{token}으로 요약을 본 그 토큰)" }

    GuestJoinResult:
      type: object
      required: [user, map]
      properties:
        user: { $ref: "#/components/schemas/User" }
        map: { $ref: "#/components/schemas/Map", description: "방금 들어간 지도(POST /invites/{token}/accept의 응답과 같다)" }

    UserUpdateRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 50, description: "계정 단위 표시 이름 (2026-09-30 결정)" }

    Map:
      type: object
      # confirmed_count만 없을 수 있다 — shortlist/api.py::count_confirmed()가 없어 이 모듈이
      # 못 채운다(maps/for_Root.md 5번). region은 애초에 선택 입력이라 없을 수 있다(#22).
      # 나머지는 maps/core.py::to_map_response가 항상 채운다.
      required: [id, title, start_date, end_date, member_count, pin_count, permissions]
      properties:
        id: { type: string }
        permissions:
          $ref: "#/components/schemas/Permissions"
          description: "요청자 기준. map 응답은 can_delete(방장만), can_leave(넘길 사람이 없는 방장은 false), can_edit(방장만)를 쓴다 (#369, #465)"
        next_owner:
          description: "요청자가 방장이고 넘길 사람이 있을 때만 채운다. 나가기 확인 창(\"나가면 ○○님이 방장이 돼요\")용. 탈퇴자 건너뛰기를 FE가 다시 계산하지 않게 서버가 정한다. 상세(GET /maps/{mapId})에서만 채우고 목록에서는 생략한다 (#369)"
          oneOf:
            - $ref: "#/components/schemas/NextOwner"
            - type: "null"
        title: { type: string, maxLength: 100 } # 코드에 근거 없음, 팀 확인 필요(멘토 리뷰 대응)
        start_date: { type: string, format: date, description: "여행 시작일 (#22)" }
        end_date: { type: string, format: date, description: "여행 종료일 (#22)" }
        region: { $ref: "#/components/schemas/MapRegion" }
        member_count: { type: integer, description: "지금 구성원 수 — 나간 사람과 탈퇴한 사람은 세지 않는다. GET /maps/{mapId}/members의 길이와 같다 (#439)" }
        pin_count: { type: integer, minimum: 0, description: "지도에 올라와 있는(삭제되지 않은) 핀 수 — 내 지도 목록 「핀 12개」 표시용. 본인의 비공개 후보는 핀이 아니라 세지 않는다 (2026-10-04, FE 요청)" }
        confirmed_count: { type: integer }
        my_role: { type: string, enum: [owner, member], description: "요청자의 지금 역할(memberships.role). 위임되면 바뀐다. 내 지도 목록의 방장 배지용 (2026-10-07, 회의). 서버가 채우기 시작하면 필수로 올린다" }
        created_by_me: { type: boolean, description: "내가 이 지도를 만들었는가(maps.created_by == 나). 내 지도 목록의 「내가 만든 지도」와 「초대받은 지도」를 가르는 값이다. 방장이 위임되면 my_role과 달라질 수 있다 — 만든 사람이 나가도 값은 바뀌지 않는다. 서버가 채우기 시작하면 필수로 올린다" }

    NextOwner:
      type: object
      description: 방장이 나가면 방장이 될 사람 (#369)
      required: [user_id, display_name]
      properties:
        user_id: { type: string }
        display_name: { type: string, maxLength: 50 }

    InviteSummary:
      type: object
      description: 초대 수락 전 화면용 요약. 지도 내용(핀의 이름·위치 등)과 내부 식별자(map_id)는 포함하지 않는다 — 수락 응답(Map)에서 받는다. 핀은 개수(pin_count)만 준다
      required: [title, start_date, end_date, member_count, pin_count, inviter_display_name, expires_at]
      properties:
        title: { type: string, maxLength: 100 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        member_count: { type: integer, minimum: 0 }
        pin_count: { type: integer, minimum: 0, description: "지도에 올라와 있는 핀 수 — 초대 카드 「핀 12개」 표시용 (2026-10-04, FE 요청)" }
        inviter_display_name: { type: string, maxLength: 50, description: "초대 링크를 발급한 사람. 탈퇴했으면 '탈퇴한 구성원'" }
        expires_at: { type: string, format: date-time }

    Invite:
      type: object
      required: [token, url, expires_at]
      properties:
        token: { type: string }
        url: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time, description: "만든 시각. 목록(GET /maps/{mapId}/invites)에서 채운다 (#467)" }
        created_by_display_name: { type: string, maxLength: 50, description: "만든 사람. 탈퇴했으면 '탈퇴한 구성원'. 목록에서 채운다 (#467)" }
        used_count: { type: integer, minimum: 0, description: "이 링크로 참여한 횟수. 목록에서 채운다 (#467)" }

    Member:
      type: object
      # display_name·online만 없을 수 있다 — auth(#4)의 users 테이블, realtime의 presence가
      # 아직 없어 못 채운다(maps/core.py::to_member_response). user_id는 항상 채운다.
      required: [user_id, role]
      properties:
        user_id: { type: string }
        role: { type: string, enum: [owner, member], description: "owner = 방장, 나머지는 member. memberships.role 기준이라 방장이 나가 위임되면 바뀐다(지도를 만든 사람과 다를 수 있다, #369). 구성원 목록의 방장 표시용 (2026-10-04, FE 요청)" }
        display_name: { type: string, maxLength: 50 } # 코드에 근거 없음, 팀 확인 필요(멘토 리뷰 대응)
        online: { type: boolean }

    MapList:
      type: object
      required: [items, limit]
      description: "내 지도 목록과 상한(#623). 2026-10-19 전에는 Map 배열이었다"
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Map" } }
        limit: { type: integer, minimum: 1, description: "만들거나 참여할 수 있는 지도 수 상한(만든 지도와 참여한 지도 합산, 삭제한 지도와 나간 지도는 세지 않음, #369). 화면은 이 값으로 \"n / limit\"을 그리고, items 수가 limit이면 「새 지도」를 막는다. 409 MAP_LIMIT의 detail.limit과 같은 값이다" }

    MapCreateRequest:
      type: object
      required: [title, start_date, end_date]
      properties:
        title: { type: string, maxLength: 100, description: "여행 제목 (#22)" } # 코드에 근거 없음, 팀 확인 필요(멘토 리뷰 대응)
        start_date: { type: string, format: date, description: "여행 시작일 (#22)" }
        end_date: { type: string, format: date, description: "여행 종료일 (#22). start_date와 같거나 그 이후여야 한다(당일치기는 같은 날)" }
        region: { $ref: "#/components/schemas/MapRegion" }

    MapUpdateRequest:
      type: object
      description: 지도 수정 (#465). 보낸 필드만 바꾼다. 빈 객체는 422. region은 바꾸기만 되고 지우지 못한다
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: "합친 결과가 start_date와 같거나 그 이후여야 한다" }
        region: { $ref: "#/components/schemas/MapRegion" }

    OwnerTransferRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, description: "새 방장이 될 지금 구성원 (#468)" }

    MapRegion:
      type: object
      description: |
        지도 만들기의 지역 검색 결과 (#22, 2026-09-28 변경 — PR #132 제안, 루트 검증 후 승인).
        선택 입력 — 없으면 지금처럼 첫 핀 좌표로 지역을 정한다(architecture.md 3절). 어디에
        쓸지(첫 지도 위치 등)는 기획안 15-4 미결.
      required: [label, lat, lng]
      properties:
        label: { type: string, maxLength: 100, description: "검색에서 고른 지역 이름 (예: 부산)" }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    PinCreateRequest:
      description: "`source`로 갈린다 — 생략하면 search(자체 DB 장소), `live`면 실시간 핀(#382)"
      oneOf:
        - $ref: "#/components/schemas/PinCreateSearch"
        - $ref: "#/components/schemas/PinCreateLive"

    PinUpdateRequest:
      type: object
      description: 핀 수정 (#466). 보낸 필드만 바꾼다. 빈 객체는 422
      minProperties: 1
      additionalProperties: false
      properties:
        memo: { type: string, maxLength: 200, description: "빈 문자열이면 메모를 지운다" }
        category: { $ref: "#/components/schemas/Category", description: "live 핀만, 반응이 없을 때만 (PATCH /pins/{pinId} 설명 참고)" }

    PinResolveRequest:
      type: object
      description: "실시간 핀 승격의 매칭 힌트 (#501). 전부 저장하지도 로깅하지도 않는다"
      required: [place_name, lat, lng]
      additionalProperties: false
      properties:
        place_name: { type: string, minLength: 1, maxLength: 100, description: "화면이 kakao_place_id로 다시 찾은 장소 이름(카카오 응답 그대로). 매칭 힌트" }
        lat: { type: number, minimum: -90, maximum: 90, description: "같은 검색 결과의 좌표. 매칭 힌트" }
        lng: { type: number, minimum: -180, maximum: 180 }
        address: { type: string, maxLength: 200, description: "선택. 같은 검색 결과의 주소. 이름이 비슷한 점포를 가를 때만 쓰는 보조 힌트" }

    NotificationType:
      type: string
      enum: [pin_reaction, member_joined, owner_changed, map_deleted, my_ai_pin_published]
      description: |
        알림 종류 (#470). `pin_reaction` 내 핀에 반응이 달림, `member_joined` 내 지도에 새 구성원(방장에게만),
        `owner_changed` 내가 방장이 됨(직접 넘김·위임 모두), `map_deleted` 내가 속한 지도가 삭제됨,
        `my_ai_pin_published` 내가 요청한 AI 추천이 지도에 올라감(다른 구성원이 「지도에 올리기」를 눌렀을 때).
        지도 복구(#464)·강퇴(#8)는 그 기능이 들어올 때 종류를 더한다.

    Notification:
      type: object
      required: [id, type, map_id, message, created_at, read]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/NotificationType" }
        map_id: { type: string, description: "알림이 난 지도. 삭제된 지도이면 이동할 수 없다 — FE가 `map_deleted`는 누르면 내 지도 목록으로 보낸다" }
        map_title: { type: string, maxLength: 100, description: "알림을 만들 때의 지도 제목(그 뒤에 바뀌어도 그대로). 지도 삭제 알림을 위해 남겨 둔다" }
        pin_id: { type: string, description: "`pin_reaction`, `my_ai_pin_published`만 — 누르면 그 핀으로 이동. 그 핀이 지워졌으면 FE가 404를 받아 조용히 지도로만 이동한다" }
        message: { type: string, maxLength: 200, description: "서버가 만든 문장. 예 \"지우님이 내 핀에 ♥를 남겼어요\". 반대 사유·메모는 싣지 않는다" }
        created_at: { type: string, format: date-time }
        read: { type: boolean }

    NotificationList:
      type: object
      required: [items, unread_count]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        unread_count: { type: integer, minimum: 0, description: "전체 안 읽은 알림 수(페이지와 무관). 99를 넘으면 FE가 99+로 그린다" }
        next_before: { type: string, description: "더 오래된 알림이 있을 때만. 다음 요청의 `before`로 쓴다" }

    NotificationReadRequest:
      type: object
      additionalProperties: false
      properties:
        ids: { type: array, maxItems: 100, items: { type: string }, description: "생략하면 전부 읽음 처리" }

    NotificationPref:
      type: object
      required: [type, enabled]
      properties:
        type: { $ref: "#/components/schemas/NotificationType" }
        enabled: { type: boolean }

    NotificationPrefs:
      type: object
      required: [prefs]
      properties:
        prefs: { type: array, items: { $ref: "#/components/schemas/NotificationPref" }, description: "알림 종류 전부, `NotificationType` 선언 순서" }

    NotificationPrefsUpdate:
      type: object
      required: [prefs]
      additionalProperties: false
      properties:
        prefs: { type: array, minItems: 1, items: { $ref: "#/components/schemas/NotificationPref" }, description: "바꿀 종류만. 같은 종류가 두 번 있으면 뒤의 것" }

    FeedbackRequest:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message: { type: string, minLength: 1, maxLength: 1000, description: "앞뒤 공백을 지운 뒤 비어 있으면 422" }
        category: { type: string, enum: [bug, idea, other], default: other, description: "버그 / 아이디어 / 기타" }
        map_id: { type: string, description: "선택. 피드백을 남길 때 보고 있던 지도(맥락용). 구성원 여부는 검사하지 않고 값은 그대로 저장한다" }

    FeedbackReceipt:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }

    LinkParseRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, maxLength: 2000, description: "사용자가 붙여넣은 지도 링크. http(s)만" }

    LinkParseResult:
      type: object
      description: 링크에서 읽은 단서 (#474). 저장되지 않는다
      required: [provider, matches, needs_search_query]
      properties:
        provider: { type: string, enum: [google, kakao] }
        name_hint: { type: string, maxLength: 100, description: "구글 링크에 든 장소 이름(사용자가 붙인 링크의 값). 화면이 GET /places/search로 이어 가는 데 쓴다. 카카오 링크에는 없다" }
        kakao_place_id: { type: string, maxLength: 100, description: "카카오 링크에서 뽑은 장소 ID(예 kakao:1234). 저장이 허용된 유일한 카카오 값 — live 핀의 kakao_place_id로 그대로 쓴다" }
        matches:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/PlaceSearchResult" }
          description: "핀으로 만들 수 있는 자체 DB 장소(pinnable=true). 없으면 빈 배열 — 지어내지 않는다(가드레일 2)"
        needs_search_query: { type: boolean, description: "true면 matches가 비었고 화면이 사용자에게 검색어(장소 이름)를 입력받아 live 핀으로 남겨야 한다. 카카오 링크에서 자체 DB 짝이 없을 때" }

    LinkPreviewRequest:
      type: object
      required: [urls]
      additionalProperties: false
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 2000 }
          description: "화면이 대화 텍스트에서 정규식으로 뽑은 지도 링크(구글맵·카카오맵). 대화 원문은 보내지 않는다"

    LinkPreviewItem:
      type: object
      required: [index, status]
      properties:
        index: { type: integer, minimum: 0, description: "요청 `urls`의 순서(0부터)" }
        status: { type: string, enum: [ok, error] }
        result: { $ref: "#/components/schemas/LinkParseResult", description: "status=ok일 때. `POST /places/from-link`의 응답과 같다" }
        error_code: { type: string, enum: [LINK_NOT_SUPPORTED, LINK_UNRESOLVED], description: "status=error일 때. 마감을 넘긴 항목도 LINK_UNRESOLVED" }
        already_pinned_pin_id: { type: string, description: "그 장소가 이 지도에 이미 있으면 그 핀의 id. 화면이 목록에서 빼고 「이미 있음」으로 보여 준다(가드레일 6)" }

    LinkPreviewResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LinkPreviewItem" }, description: "요청 urls와 같은 개수, 같은 순서" }

    BulkPinRequest:
      type: object
      required: [pins]
      additionalProperties: false
      properties:
        pins:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/PinCreateRequest" }
          description: "POST /maps/{mapId}/pins의 요청 본문과 같은 항목"

    BulkPinItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer, minimum: 0, description: "요청 `pins`의 순서(0부터)" }
        status: { type: string, enum: [created, duplicate, rejected], description: "created = 핀이 만들어짐, duplicate = 이미 지도에 있는 장소(PIN_DUPLICATE), rejected = 그 밖의 거절" }
        pin: { $ref: "#/components/schemas/Pin", description: "status=created일 때 요청자 기준 Pin" }
        error:
          type: object
          description: "status가 duplicate·rejected일 때. 핀 생성 하나가 낼 에러와 같다"
          required: [code]
          properties:
            code: { type: string, description: "PIN_DUPLICATE, PLACE_NOT_SUPPORTED, VALIDATION_ERROR 등(docs/errors.md)" }
            message: { type: string }
            detail: { type: object, additionalProperties: true, description: "PIN_DUPLICATE면 pin_id(이미 있는 핀)" }

    BulkPinResult:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/BulkPinItemResult" }, description: "요청 pins와 같은 개수, 같은 순서" }

    PinCreateLive:
      type: object
      description: "#382 실시간 핀 — 자체 DB에 없는 장소. 이름·좌표는 받지도 저장하지도 않는다"
      required: [source, category, kakao_place_id, search_query]
      additionalProperties: false
      properties:
        source: { type: string, enum: [live] }
        category: { $ref: "#/components/schemas/Category", description: "음식점·카페·관광지만. 숙소·기타는 422 VALIDATION_ERROR" }
        kakao_place_id: { type: string, minLength: 1, maxLength: 100, description: "GET /places/search 결과의 place_id(예 kakao:1234)를 그대로. 저장이 허용된 유일한 카카오 값(#53). 같은 지도에서 같으면 409 PIN_DUPLICATE" }
        search_query: { type: string, minLength: 1, maxLength: 100, description: "사용자가 장소 검색창에 친 검색어(사용자 입력이라 저장 가능). 화면이 지도를 열 때마다 이 검색어로 카카오 키워드 검색을 다시 해서 kakao_place_id를 찾는다" }
        memo: { type: string, maxLength: 200, description: "선택. 핀을 찍은 사람이 남기는 한마디(예 \"여기 곱창 맛있대\"). 사용자 입력" }

    PinCreateSearch:
      type: object
      required: [category, place_id, place_name, lat, lng]   # source=search의 매칭 힌트 전부 필요
      properties:
        category: { $ref: "#/components/schemas/Category" }
        source: { type: string, enum: [link, search, coordinate], default: search, description: "search 경로(자체 DB 장소). coordinate·link는 값만 남겨 둔 것(v2 확장용)이며 보내면 422 (#191·#147) — 생략하면 search. 실시간 핀은 PinCreateLive(source=live)" }
        link_url: { type: string, maxLength: 2000, description: "v1에서는 받지 않음 — 보내면 422 (#147). v2 카톡 내보내기용으로 남겨 둔 필드" } # 사용자가 직접 붙여넣는 값, 코드에 근거 없음(멘토 리뷰 대응)
        place_id: { type: string, maxLength: 100, description: "source=search의 **매칭 힌트** — GET /places/search 결과의 place_id(카카오 장소 ID)를 그대로. 저장하지 않는다" }
        place_name: { type: string, maxLength: 100, description: "매칭 힌트 — 검색 결과의 이름을 그대로. 저장하지 않는다(핀 이름은 자체 DB 장소의 이름, #191)" } # 루트 결정(2026-09-23, 2026-10-01 #191로 대체): 사용자가 이미 들고 있는
        # 값(구글맵 링크·검색 결과)을 그대로 저장 — places 파이프라인(#53 대기)을 기다리지 않는다.
        # pins/core.py::validate_create가 이미 검증하는 범위를 그대로 옮김(멘토 리뷰 대응).
        lat: { type: number, minimum: -90, maximum: 90, description: "매칭 힌트 — 검색 결과의 좌표를 그대로. 저장하지 않는다(핀 좌표는 자체 DB 장소의 좌표)" }
        lng: { type: number, minimum: -180, maximum: 180, description: "매칭 힌트 — 검색 결과의 좌표를 그대로. 저장하지 않는다" }
        address: { type: string, maxLength: 200, description: "선택, 매칭 힌트 — 검색 결과의 address를 그대로. 이름이 비슷한 점포를 가르는 보조 판단에만 쓰고 저장·로깅하지 않는다(#500, #501). 없어도 된다" }

    PlaceSearchResult:
      type: object
      description: GET /places/search 한 건 — **화면 표시용이며 서버에 저장되지 않는다**. 핀을 만들 때 place_id·place_name·lat·lng·category를 그대로 POST /maps/{mapId}/pins로 되돌려 보내면 서버가 같은 자체 DB 장소를 찾는 매칭 힌트로 쓴다
      required: [place_id, place_name, lat, lng]
      properties:
        place_id: { type: string, description: "\"<소스>:<소스 내 id>\" 형태(예 kakao:1234). 불투명 값으로 취급한다" }
        place_name: { type: string, maxLength: 100, description: "POST /maps/{mapId}/pins의 place_name과 같은 이름 — 그대로 보낸다" }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        category: { $ref: "#/components/schemas/Category", description: "제공 소스가 추정한 분류(화면 표시용 제안). 숙소·기타로 추정되는 장소는 자체 DB에 없어 핀으로 만들 수 없다(v1)" }
        address: { type: string, maxLength: 200 }
        place_source: { $ref: "#/components/schemas/PlaceSource" }
        pinnable: { type: boolean, description: "자체 DB에 짝이 있어 `source: search`로 핀을 만들 수 있는가(서버가 자체 DB를 읽기만 해서 계산, 카카오 ID를 기록하지 않는다). false여도 `source: live`(#382)로 「그래도 핀 남기기」를 열 수 있다 — FE는 이 결과에 \"장소 정보가 없는 핀이에요\"를 안내한다. 없으면 true로 본다(자체 DB 연결 전)" }

    LabelConfidence:
      type: string
      enum: [known, unknown]

    Check:
      type: object
      description: 가드레일 5 "조건별 충족 체크"
      required: [fact_key, label, passed, confidence]
      properties:
        fact_key: { type: string }
        label: { type: string }
        passed: { type: boolean }
        confidence: { $ref: "#/components/schemas/LabelConfidence" }
        needs_check: { type: boolean, description: "unknown_policy=pass+needs_check인 취향 조건이 unknown일 때 true" }

    Pin:
      type: object
      # place_name·created_by_display_name·checks·source_run_id만 없을 수 있다 —
      # places·maps·recommend가 없어 pins/core.py::to_pin_response가 못 채운다(pins/for_Root.md 6번).
      # lat·lng는 실시간 핀(source=live, #382)에 없다 — 서버가 카카오 좌표를 저장하지 않는다. 나머지는 항상 채운다.
      required: [id, map_id, category, kind, visibility, created_by, created_at, reaction_summary, permissions]
      properties:
        id: { type: string }
        map_id: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        kind: { $ref: "#/components/schemas/PinKind" }
        visibility: { type: string, enum: [public, private], description: "v1은 항상 public. 이 값으로 분기하지 않는다 — 비공개 후보는 핀이 아니라 Candidate다(#273). 다음에 Pin 스키마를 크게 바꿀 때 같이 지운다" }
        # PinCreateSearch.lat/lng와 동일 근거(pins/core.py::validate_create).
        lat: { type: number, minimum: -90, maximum: 90, description: "자체 DB 장소의 좌표. **live 핀에는 없다**(#382) — 그 핀의 위치는 화면이 kakao_place_id로 실시간에 찾는다" }
        lng: { type: number, minimum: -180, maximum: 180, description: "lat과 같다. live 핀에는 없다" }
        source: { type: string, enum: [db, live], description: "db = 자체 DB 장소를 가리키는 핀, live = 실시간 핀(#382, PinCreateLive). 없으면 db로 본다 — 서버가 채우기 시작하면 필수로 바꾼다. (`default`를 쓰지 않는다: 타입 생성기가 필수로 바꿔 버린다)" }
        memo: { type: string, maxLength: 200, description: "핀의 메모(작성자가 남긴 한마디). live 핀은 만들 때, 모든 핀은 PATCH /pins/{pinId}로 쓴다(#466). 없을 수 있다" }
        kakao_place_id: { type: string, maxLength: 100, description: "live 핀만 — 카카오 장소 ID. 화면이 위치를 다시 찾는 열쇠다" }
        search_query: { type: string, maxLength: 100, description: "live 핀만 — 핀을 찍을 때 사용자가 친 검색어. 화면이 `kakao_place_id`를 이 검색어로 다시 찾는다" }
        place_name: { type: string, maxLength: 100, description: "자체 DB 장소의 이름 (#191). 핀에 따로 저장하지 않고 장소에서 가져온다. live 핀에는 없다(#382) — 화면이 실시간 검색 결과에서 읽는다" }
        place_url: { type: string, maxLength: 2000, description: "카카오 장소 페이지 링크. **외부 브라우저로 연다 — 앱 안 WebView 금지**(카카오 약관). 자체 DB 핀은 매칭된 장소에 기록된 URL(저장 허용), 실시간 핀(source=live)은 kakao_place_id로 응답 때 만든다(저장하지 않음, #445). 자체 DB 장소에 카카오 URL이 아직 기록되지 않았으면 필드를 생략한다" }
        created_by: { type: string, description: "핀을 찍은 구성원의 user_id (#26)" }
        created_at: { type: string, format: date-time, description: "핀이 지도에 올라온 시각. AI 추천 핀은 「지도에 올리기」를 누른 시각이다. 「최근 추가 순」 정렬, 「최근 핀으로 이동」, 「10분 전」 표시용 (2026-10-04, FE 요청)" }
        created_by_display_name: { type: string, maxLength: 50, description: "핀 상세에서 '누가 찍었는지' 표시용 (#26). 작성자가 탈퇴했으면 '탈퇴한 구성원', 탈퇴하지 않았는데 이 지도에서 나갔으면 '나간 구성원', 아니면 실명. 조회할 때 계산하고 다시 들어오면 실명으로 돌아간다 (#369)" } # 코드에 근거 없음, 팀 확인 필요
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
          description: "게시된 AI 추천 핀도 상세에서 계속 노출한다 (가드레일 5)"
        source_run_id: { type: [string, "null"] }
        reason: { type: string, description: "AI 추천 핀만 — 추천 이유. 게시된 뒤에도 유지 (가드레일 5)" }
        member_fulfillment: { $ref: "#/components/schemas/MemberFulfillment" }
        place_source: { $ref: "#/components/schemas/PlaceSource" }
        my_reaction:
          description: 내가 이 핀에 남긴 반응. 없으면 null — 「♥ 2 · 나」 칩과 「의견 취소」 링크용
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Reaction"
        reaction_summary:
          type: object
          required: [like, against]
          properties:
            like: { type: integer }
            against: { type: integer }
        permissions: { $ref: "#/components/schemas/Permissions" }

    ReactionRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [like, against], description: "♥ 좋음 / 🚫 반대. 2026-10-07(#360)에 neutral(△ 조율 필요)을 없앴다 — 보내면 422 VALIDATION_ERROR" }
        reason_text: { type: string, maxLength: 140 }
        reason_chip_ids:
          type: array
          maxItems: 10 # 사전 정의된 칩 목록에서 고르는 값, 코드에 근거 없음(멘토 리뷰 대응)
          items: { type: string, maxLength: 50 }
          description: "GET /categories/{category}/reason-chips가 준 칩의 id. 그 핀의 카테고리 목록에 없는 id는 422 VALIDATION_ERROR (2026-10-04, #60). 반대(against)에서만 보낸다"

    Reaction:
      type: object
      # reason_text만 없을 수 있다 — like 반응은 사유가 필수가 아니다(가드레일 3).
      required: [pin_id, user_id, type]
      properties:
        pin_id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [like, against] }
        reason_text: { type: string, maxLength: 140 } # ReactionRequest.reason_text와 짝을 맞춤
        reason_chip_ids:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 50 }
          description: "반대 사유 칩 id (ReasonChip.id)"
        display_name: { type: string, maxLength: 50, description: "GET /pins/{pinId}/reactions 전용 — 의견 목록에 표시할 이름" }

    ReasonChip:
      type: object
      description: 반대(🚫) 사유로 고를 수 있는 미리 정의된 칩 (#60, 2026-10-04). 목록의 정본은 docs/constraints.md 「반대 사유 칩」 표
      required: [id, label]
      properties:
        id: { type: string, maxLength: 50, description: "안정적인 식별자(예: food_spicy). 반응 요청의 reason_chip_ids에 넣는다. 이름이 바뀌어도 id는 바뀌지 않는다" }
        label: { type: string, maxLength: 20, description: "화면에 보이는 이름(예: 매워요)" }
        fact_key: { type: string, description: "이 칩이 뜻하는 조건의 fact_key. 있을 때만. 추천 근거를 만들 때 서버가 칩 하나당 근거 줄 하나를 만들고 이 키와 표의 방향(wants)을 코드로 채운다. 모델(②)을 거치지 않는다(#412)" }

    FilterCounts:
      type: object
      required: [by_category, by_kind, members_with_opinion, members_total]
      properties:
        members_with_opinion: { type: integer, minimum: 0, description: "이 지도의 핀에 ♥·🚫 반응을 하나라도 남긴 구성원 수. 「2/4명이 의견을 남겼어요」의 2. 탈퇴한 구성원은 세지 않는다 (2026-10-04, FE 요청)" }
        members_total: { type: integer, minimum: 0, description: "현재 구성원 수(= Map.member_count). 「2/4명」의 4" }
        by_category:
          type: object
          additionalProperties: { type: integer }
        by_kind:
          type: object
          additionalProperties: { type: integer }

    Readiness:
      type: object
      properties:
        ready: { type: boolean, description: "answered_count >= required_count (2026-10-07, #360)" }
        answered_count: { type: integer, description: "그 카테고리에서 ♥ 또는 🚫 의견이 달린 핀의 수. 삭제된 핀·나간 구성원·탈퇴자의 반응은 세지 않는다. 혼자 쓰는 지도도 똑같다" }
        required_count: { type: integer, description: "항상 1. 구성원 수에 비례하던 ceil(N/2)는 폐기했다(#360). 필드를 남긴 것은 FE 호환(「의견 핀 0/1」 표기)용이다" }

    EvidenceLine:
      type: object
      required: [id, author_id, text, badge, is_active, permissions]
      properties:
        id: { type: string }
        author_id: { type: string }
        author_display_name: { type: string, maxLength: 50 } # 코드에 근거 없음, 팀 확인 필요(멘토 리뷰 대응)
        text: { type: string, maxLength: 140 } # reason_text와 같은 성격의 자유 텍스트라 같은 값을 씀
        badge: { type: string, enum: [required, preferred, reference], description: "꼭/선호/참고 (5-5). 「+」로 직접 추가한 줄은 preferred다(#707). v1 서버는 reference를 만들지 않는다" }
        fact_key: { type: [string, "null"] }
        fact_label: { type: [string, "null"], maxLength: 30, description: "fact_key의 화면 표시 이름(예: \"한식\", \"횟집\", \"조용한 곳\", \"주차 가능\"). 서버가 내려 주므로 FE가 키→이름 표를 따로 들지 않는다. 방향 표시는 \"{fact_label} 제외\"(wants=false) / \"{fact_label} 선호\"(wants=true). fact_key가 없으면 없거나 null" }
        wants: { type: [boolean, "null"], description: "이 특징(fact_key)이 있는 장소를 원하는가(#228). true=원함(\"한식 먹자\"), false=원하지 않음(\"한식 말고\"), 없거나 null=모름. FE는 근거 줄에 해석한 방향(예: \"한식 제외\")을 보여 주어 틀리면 −로 뺄 수 있게 한다" }
        enforced: { type: boolean, description: "이 줄이 후보를 거르거나 점수를 매기는 데 실제로 쓰이는가(#720). fact_key가 있으면 true, 키 없는 줄(알레르기·가격 등 모델이 라벨로 옮기지 못한 사유)은 false — 서버가 이 줄로 후보를 걸러 주지 않는다. 없으면 true로 본다(구버전 서버). FE는 enforced=false인 badge=required 줄을 「꼭 지켜야 하는 조건」으로 보이지 말고 「걸러지지 않아요. 가게에 직접 확인해 주세요」처럼 구분해 보여 준다" }
        is_active: { type: boolean }
        permissions: { $ref: "#/components/schemas/Permissions" }

    EvidencePatchRequest:
      type: object
      properties:
        toggle:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              is_active: { type: boolean }
        add:
          type: array
          maxItems: 5
          description: "직접 추가할 글. 한 요청에 5개까지, run 하나에 모두 10개까지(#707). 근거 줄이 아니라 글 수로 센다. 한 요청 안의 같은 글은 하나로 친다"
          items:
            type: object
            properties:
              text: { type: string, minLength: 1, maxLength: 140, description: "앞뒤 공백을 뗀 뒤 1~140자(#716)" } # EvidenceLine.text와 동일 근거

    Region:
      type: object
      required: [id, label, signature, confirmed]
      properties:
        id: { type: string }
        label: { type: string }
        signature: { type: string }
        confirmed: { type: boolean }

    RecommendRun:
      type: object
      required: [id, map_id, category, status, attempt_no]
      properties:
        id: { type: string }
        map_id: { type: string }
        category: { $ref: "#/components/schemas/RecommendCategory" }
        status: { type: string, enum: [collecting_evidence, awaiting_region_confirm, executing, done, failed] }
        attempt_no: { type: integer, description: "이 사람이 이 지도에서 지금까지 한 시도 횟수(카테고리 무관, 새 추천·다시 추천 모두 1씩). 상한은 attempt_limit" }
        attempt_limit: { type: integer, description: "한 사람이 한 지도에서 추천을 받을 수 있는 횟수 상한(2026-10-15부터 10). 서버가 채운다 — FE는 숫자를 하드코딩하지 말고 이 값으로 「n/10」을 그린다. 없으면 구버전 서버다" }
        default_radius_walk_min: { type: integer, description: "기본값 원의 현재 도보 시간(분). 반경 넓히기마다 5씩 늘어난다 (기본 15, 상한 30)" }

    RunSummary:
      type: object
      description: 지난 추천 기록 한 건 (#469). 내가 요청한 run만 온다
      required: [id, map_id, category, status, attempt_no, created_at, candidate_count, published_count]
      properties:
        id: { type: string }
        map_id: { type: string }
        category: { $ref: "#/components/schemas/RecommendCategory" }
        status: { type: string, enum: [collecting_evidence, awaiting_region_confirm, executing, done, failed] }
        attempt_no: { type: integer, description: "지금까지의 시도 횟수(반경 넓히기·다시 추천 포함)" }
        attempt_limit: { type: integer, description: "시도 횟수 상한(RecommendRun.attempt_limit과 같다)" }
        created_at: { type: string, format: date-time, description: "run을 만든 시각. 목록은 이 값의 내림차순" }
        candidate_count: { type: integer, minimum: 0, description: "마지막 시도의 후보 수. done이 아니면 0" }
        published_count: { type: integer, minimum: 0, description: "그 run에서 「지도에 올리기」로 게시한 후보 수" }

    MemberFulfillment:
      type: object
      description: 구성원 충족 집계 (가드레일 5). 게시 뒤에도 유지된다
      required: [satisfied, total]
      properties:
        satisfied: { type: integer, minimum: 0, description: "이 후보가 자기 조건을 전부 확인된 값으로 만족시키는 구성원 수. 라벨이 모름(확인 필요)인 조건이 하나라도 있으면 충족으로 세지 않는다(#620)" }
        total: { type: integer, minimum: 0, description: "집계 대상 구성원 수 — 서비스가 확인할 수 있는 조건을 남긴 구성원. 선호(♥·선호 사유)와 키가 있는 실격 사유(required)를 낸 구성원이다(#246 G1). 키 없는 반대 사유(알러지 글, 「취향이 아니에요」 등)만 남긴 구성원은 확인한 것이 없어 빠진다(#620, 2026-10-19)" }
        by_member:
          type: array
          items:
            type: object
            required: [user_id, satisfied]
            properties:
              user_id: { type: string }
              display_name: { type: string, maxLength: 50 }
              satisfied: { type: boolean }

    PlaceSource:
      type: object
      description: 장소 정보 출처 (가드레일 5, 5-6-1 지도 출처 표시)
      required: [provider]
      properties:
        provider: { type: string, enum: [kakao, naver, google, permit, tourapi], description: "permit = 지방행정 인허가 공공데이터, tourapi = 한국관광공사 TourAPI — 자체 장소 DB의 출처(#53). kakao·naver·google은 검색 결과 표시용(저장하지 않음)" }
        url: { type: string, description: "출처 페이지 링크. 이용약관상 링크 제공이 불가하면 생략" }

    Candidate:
      type: object
      required: [id, rank, checks, reason, member_fulfillment, visibility, permissions]
      properties:
        id: { type: string }
        place_name: { type: string, maxLength: 100 } # Pin.place_name과 동일 근거(멘토 리뷰 대응)
        lat: { type: number, minimum: -90, maximum: 90, description: "자체 DB 장소의 좌표(자체 데이터라 저장·노출 가능, #190). 게시 전 나만 보는 점선 핀을 지도에 그리는 데 쓴다 (#340, 최종기획안 5-5-1). 서버가 채우기 시작하면 필수로 올린다" }
        lng: { type: number, minimum: -180, maximum: 180, description: "lat과 같다" }
        region_label: { type: string, description: "5-6-1 지역별 안배 태그" }
        rank: { type: integer }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        reason: { type: string, description: "추천 이유 — 근거 없는 한 줄 추천 금지 (가드레일 5)" }
        member_fulfillment: { $ref: "#/components/schemas/MemberFulfillment" }
        place_source: { $ref: "#/components/schemas/PlaceSource" }
        visibility: { type: string, enum: [private, published] }
        published_pin_id: { type: [string, "null"], description: "게시하기 전에는 null이거나 필드가 없다" }
        permissions: { $ref: "#/components/schemas/Permissions" }

    RecommendResult:
      type: object
      required: [run_id, funnel, regions, candidates]
      properties:
        run_id: { type: string }
        funnel:
          type: array
          items:
            type: object
            required: [label, removed_count]
            properties:
              label: { type: string }
              removed_count: { type: integer }
          description: "5-6 깔때기 표. 2026-10-15부터 「영업 종료 제거」 다음에 「추천 가능 아님 제거」 단계가 있다(places.can_recommend=false인 장소를 후보 풀에서 뺀 수, docs/data-model.md)"
        regions:
          type: array
          items: { $ref: "#/components/schemas/Region" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }

    ShortlistItem:
      type: object
      required: [id, pin, added_by, permissions]
      properties:
        id: { type: string }
        pin: { $ref: "#/components/schemas/Pin" }
        visit_order: { type: [integer, "null"], description: "순서를 정하지 않았으면 null이거나 필드가 없다" }
        added_by: { type: string }
        permissions: { $ref: "#/components/schemas/Permissions" }

    Route:
      type: object
      required: [region_label, ordered_pin_ids, total_distance_m, legs]
      properties:
        region_label: { type: string }
        ordered_pin_ids:
          type: array
          items: { type: string }
        total_distance_m: { type: number }
        legs:
          type: array
          items:
            type: object
            required: [from_pin_id, to_pin_id, distance_m, approx_minutes]
            properties:
              from_pin_id: { type: string }
              to_pin_id: { type: string }
              distance_m: { type: number }
              approx_minutes: { type: integer }

    # ---------- ads (추천 탭 광고, docs/ads.md, #642) ----------
    AdPlace:
      type: object
      required: [place_id, name, category, lat, lng]
      description: "광고 장소. 자체 DB(places) 행에서만 읽는다(#53). 「지도에 올리기」 매칭 힌트로 place_id, name, lat, lng, category를 그대로 쓴다"
      properties:
        place_id: { type: string, description: "자체 DB 장소 id. POST /maps/{mapId}/pins의 place_id 힌트로 그대로 보낸다(#473과 같은 경로)" }
        name: { type: string, maxLength: 100 }
        category: { $ref: "#/components/schemas/RecommendCategory" }
        address: { type: [string, "null"], maxLength: 200 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        place_url: { type: [string, "null"], maxLength: 2000, description: "places에 기록된 카카오 장소 링크. 있으면 「카카오맵에서 보기」를 새 창으로 연다(앱 안 WebView 금지). 없으면 그 버튼을 숨긴다" }

    Ad:
      type: object
      required: [ad_id, place, on_map]
      description: "광고 칸 하나. 이유, 조건별 충족 체크, 구성원 충족 집계는 없다(광고는 필터를 거치지 않는다, docs/ads.md 2절 4번). 계약 메모와 집계 값은 내보내지 않는다"
      properties:
        ad_id: { type: string }
        place: { $ref: "#/components/schemas/AdPlace" }
        on_map: { type: boolean, description: "이 지도에 같은 장소의 핀이 이미 있다(같은 place_id의 db 핀, 또는 같은 카카오 장소 ID의 실시간 핀). true면 「지도에 올리기」 대신 비활성 「이미 지도에 있어요」" }

    AdList:
      type: object
      required: [ads]
      properties:
        ads: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/Ad" } }

    AdClickRequest:
      type: object
      required: [map_id]
      properties:
        map_id: { type: string, minLength: 1, description: "권한 확인용. 저장하지 않는다" }

    # ---------- agent (v2 계획 보조 에이전트, docs/agent-v2.md) ----------
    AgentDiagnosis:
      type: string
      enum: [stall, split, no_reaction, category_gap]
      description: "제안 종류. stall=반대 후 정체, split=의견 갈림, no_reaction=아직 확인되지 않은 핀, category_gap=확정 리스트에 빠진 카테고리 (docs/agent-v2.md 6절)"

    AgentAdviceLine:
      type: object
      required: [segments, is_guess]
      description: |
        서버가 렌더한 문장 한 줄(#717). 에이전트의 말과 구성원이 쓴 글을 한 문자열에 섞지 않고 조각으로 나눠 내린다.
        FE는 조각을 차례로 이어 그리되, quote는 구성원 의견(인용 모양), pin은 핀 이름 모양으로 따로 그린다. 조각 text의 합은 300자 이하.
        is_guess=false는 확인된 사실(「확인된 것」), true는 추정(「AI 조언」, 화면에 '추정' 표시).
        예: [{kind: text, text: "반대 의견이 2개 남은 뒤로 새 후보가 없어요. "}, {kind: pin, pin_id: "p1", text: "성수 칼국수"}, {kind: text, text: "에는 "}, {kind: quote, reaction_id: "r1", text: "너무 매워요"}, {kind: text, text: "라는 의견이 있어요"}]
      properties:
        segments: { type: array, minItems: 1, items: { $ref: "#/components/schemas/AdviceSegment" } }
        is_guess: { type: boolean }

    AdviceSegment:
      type: object
      required: [kind, text]
      description: |
        문장 조각(#717). text는 에이전트 문장(서버 문구와 검증된 숫자)이다. quote는 구성원 사유 글 중 서버가 검증한 범위만이고 원문 전체가 아니다.
        누가 쓴 글인지는 싣지 않는다(이름 없음). pin은 핀 이름이다(장소 이름, 실시간 핀은 사용자가 친 검색어).
      properties:
        kind: { type: string, enum: [text, quote, pin] }
        text: { type: string, maxLength: 300 }
        reaction_id: { type: string, description: "kind=quote일 때만. 인용한 반응" }
        pin_id: { type: string, description: "kind=pin일 때만. 그 핀" }

    AgentAction:
      type: object
      required: [index, type, label, params]
      description: |
        버튼 하나. 사람이 원래 하던 동작으로만 이어진다(확정, 삭제, 반응 변경, 근거 줄 빼기는 없다). FE가 하는 일은 docs/agent-v2.md 16.3 표.
        open_recommend → AI 추천 탭에서 손으로 누를 때와 같은 `POST /maps/{mapId}/runs`. show_pins → 지도 탭 필터. search_place → 장소 검색 시트.
        open_route → 리스트 탭 동선. widen_radius → 기존 반경 넓히기. open_evidence → 근거 확인 화면.
      properties:
        index: { type: integer, minimum: 0, description: "accept 요청의 action_index" }
        type: { type: string, enum: [open_recommend, show_pins, search_place, open_route, widen_radius, open_evidence] }
        label: { type: string, maxLength: 40, description: "버튼 문구(서버 렌더). 예: \"음식점 추천 받기\", \"미확인 핀 보기\"" }
        params:
          type: object
          description: "type마다 쓰는 것만 채운다"
          properties:
            category: { $ref: "#/components/schemas/Category" }
            pin_ids: { type: array, items: { type: string }, description: "show_pins: 보여 줄 핀" }
            unseen_only: { type: boolean, description: "show_pins: 내가 아직 반응하지 않은 핀만" }
            run_id: { type: string, description: "widen_radius, open_evidence: 대상 run" }
            evidence_line_ids: { type: array, items: { type: string }, description: "open_evidence: 강조할 근거 줄. 요청자 본인이 쓴 줄만 들어간다(근거 줄 빼기는 쓴 사람만, docs/permissions.md)" }

    AgentConflictAxis:
      type: object
      required: [label, like_side, against_side]
      description: "의견 갈림의 충돌 지점 하나. 이름 대신 ♥ 쪽 / 🚫 쪽으로 보여 준다. 문구는 서버 렌더"
      properties:
        label: { type: string, description: "예: \"조용한 곳\"" }
        like_side: { type: [string, "null"], description: "♥ 쪽. 예: \"원함 2\"" }
        against_side: { type: [string, "null"], description: "🚫 쪽. 예: \"원하지 않음 1\"" }

    AgentAnalysis:
      type: object
      required: [conflict_type, axes]
      description: "split 제안에만 붙는다. 충돌 종류는 코드가 ②의 키와 방향으로 정한다(docs/agent-v2.md 6.3)"
      properties:
        conflict_type: { type: string, enum: [same_axis, different_axes, unclear], description: "same_axis=같은 특징을 두고 방향이 반대, different_axes=서로 다른 특징, unclear=한쪽에 키 있는 사유가 없음" }
        axes: { type: array, items: { $ref: "#/components/schemas/AgentConflictAxis" } }

    AgentSuggestion:
      type: object
      required: [id, diagnosis, category, title, advice, actions, created_at, expires_at]
      description: "지도 제안. 지도당 동시에 하나. 전체 공개이고 개인 제안은 없다. 누가 수락하거나 닫았는지는 싣지 않는다"
      properties:
        id: { type: string }
        diagnosis: { $ref: "#/components/schemas/AgentDiagnosis" }
        category:
          oneOf:
            - $ref: "#/components/schemas/Category"
            - type: "null"
        title: { type: string, maxLength: 100, description: "서버 렌더. 예: \"확정 리스트에 카페가 아직 없어요\"" }
        analysis:
          oneOf:
            - $ref: "#/components/schemas/AgentAnalysis"
            - type: "null"
        advice: { type: array, items: { $ref: "#/components/schemas/AgentAdviceLine" } }
        actions: { type: array, items: { $ref: "#/components/schemas/AgentAction" } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "만들고 24시간 뒤. 지나면 만료(agent.resolved, status=expired)" }

    AgentSummaryItem:
      type: object
      required: [label, member_count]
      properties:
        fact_key: { type: [string, "null"] }
        label: { type: string, description: "서버 렌더. 키 표시 이름(근거 줄과 같은 이름)에 방향을 붙인다. 예: \"매운맛 전문 제외\", \"조용한 곳 원함\"" }
        member_count: { type: integer, minimum: 1, description: "그 조건을 말한 구성원 수. 한 사람이 여러 번 말해도 1" }

    AgentSplitPref:
      type: object
      required: [label, want_count, avoid_count]
      properties:
        fact_key: { type: string }
        label: { type: string, description: "예: \"조용함\"" }
        want_count: { type: integer, minimum: 1 }
        avoid_count: { type: integer, minimum: 1 }

    AgentSummary:
      type: object
      required: [category, must_keep, common_prefs, split_prefs, vague_fixable, not_filtered, updated_at]
      description: |
        우리 조건 요약 — 카테고리마다 하나, 다섯 칸 (docs/agent-v2.md 8절). 칸 나누기와 개수는 코드가 ②의 키와 방향으로 한다. 구성원 이름은 없고 개수만 있다.
        「이 조건으로 {category} 추천 받기」 버튼은 category가 RecommendCategory일 때만 보인다(누르면 accept 없이 바로 open_recommend).
      properties:
        category: { $ref: "#/components/schemas/Category" }
        must_keep: { type: array, items: { $ref: "#/components/schemas/AgentSummaryItem" }, description: "지키려는 조건(실격 조건)" }
        common_prefs: { type: array, items: { $ref: "#/components/schemas/AgentSummaryItem" }, description: "2명 이상이 같은 방향으로 말한 선호" }
        split_prefs: { type: array, items: { $ref: "#/components/schemas/AgentSplitPref" }, description: "같은 특징에 원함과 피함이 함께 있는 선호" }
        vague_fixable:
          type: object
          required: [count, requests]
          description: "칸 이름 「더 적어 주면 반영돼요」. 키 없는 사유 중 고쳐 쓰면 추천에 반영될 수 있는 것"
          properties:
            count: { type: integer, minimum: 0 }
            requests: { type: array, items: { type: string }, description: "구체화 요청 문장(서버 렌더). 예: \"거리 조건은 '숙소에서 걸어서 10분'처럼 적어 주세요\"" }
        not_filtered:
          type: object
          required: [count, notices]
          description: "칸 이름 「추천이 거르지 않아요」. 알러지 사유(#425)와 가격 칩(#423). 원문은 싣지 않는다"
          properties:
            count: { type: integer, minimum: 0 }
            notices: { type: array, items: { type: string }, description: "고정 안내. 예: \"알러지 같은 조건은 추천이 거르지 않아요. 가게에 직접 확인해 주세요.\"" }
        updated_at: { type: string, format: date-time }

    AgentSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        updated_by: { type: [string, "null"], description: "마지막으로 바꾼 구성원의 user_id. 한 번도 바꾸지 않았으면(기본값 켜짐) null" }
        updated_at: { type: [string, "null"], format: date-time }

    AgentSettingsRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    AgentState:
      type: object
      required: [settings, active_suggestion, has_unseen, summaries]
      properties:
        settings: { $ref: "#/components/schemas/AgentSettings" }
        active_suggestion:
          description: "지금 제안. 없으면 null. 모드가 꺼져 있으면 항상 null"
          oneOf:
            - $ref: "#/components/schemas/AgentSuggestion"
            - type: "null"
        has_unseen: { type: boolean, description: "지금 제안이 있고 요청자가 아직 열람하지 않았으면 true — 버튼의 점. 요약 갱신에는 점을 켜지 않는다" }
        summaries: { type: array, items: { $ref: "#/components/schemas/AgentSummary" }, description: "요약이 만들어진 카테고리만" }

    AgentAcceptRequest:
      type: object
      required: [action_index]
      properties:
        action_index: { type: integer, minimum: 0 }

    AgentAcceptResponse:
      type: object
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/AgentAction" }

    RunAdvice:
      type: object
      required: [run_id, kind, advice, actions]
      description: "추천 막힘 조언 (docs/agent-v2.md 9절). 요청자에게만 보인다. 다른 구성원이 쓴 실격 조건 때문이면 버튼 없이 사실 문장만 있다(이름은 쓰지 않는다)"
      properties:
        run_id: { type: string }
        kind: { type: string, enum: [radius, soft_relax, vague_reason, exhausted], description: "radius=반경 밖에서 많이 빠짐, soft_relax=실격 조건이 많이 거름, vague_reason=키 없는 근거가 있음, exhausted=이미 제안·거절한 곳으로 소진" }
        advice: { type: array, items: { $ref: "#/components/schemas/AgentAdviceLine" } }
        actions: { type: array, items: { $ref: "#/components/schemas/AgentAction" }, description: "widen_radius, open_evidence만" }

    # ---------- course (AI 코스 짜기, #334 · 모델 호출 결정 #580) ----------
    CourseRequest:
      type: object
      properties:
        request_text:
          type: [string, "null"]
          maxLength: 100
          description: "요청 한 줄(선택). 예: '둘째 날은 실내 위주로'. 요청자가 이 run을 위해 쓴 글이라 run에만 저장되고 다른 구성원에게 보이지 않는다. 모델은 이 글을 목표(실내 위주, 야경 마지막, 덜 걷기, 여유 있게, 한 장소를 그 날에, 두 장소 같은 날)로 바꾼다"
        member_constraints:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/CourseMemberConstraint" }
          description: "구성원 제약(선택). 고정 목록에서 고른다 — 지금은 하루 도보 상한 하나"

    CourseMemberConstraint:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [daily_walk_max] }
        value: { type: integer, minimum: 10, maximum: 480, description: "하루 도보 상한(분)" }
        day: { type: [string, "null"], pattern: "^d[1-9][0-9]*$", description: "날짜 별칭 d1 … (d1 = 지도 첫날). 없으면 모든 날. 여행 기간 밖이면 422 VALIDATION_ERROR" }

    CourseRunCreated:
      type: object
      required: [course_run_id]
      properties:
        course_run_id: { type: string }

    CourseRun:
      type: object
      required: [id, map_id, status, outcome, failure_code, goals, unmatched, steps, days, violations, checks, excluded, snapshot_at, stale, created_at, finished_at]
      description: |
        코스 run 하나. 요청자에게만 보인다. 문장(label, text, steps)은 모두 서버가 코드 템플릿으로 만든 것이라 FE는 그대로 보여 준다.
        AI는 목표를 세우고 코드 최적화를 지휘할 뿐이고, 위반 판정·이동시간·순서는 코드가 계산한다. 영업시간을 아직 모르므로(places에 칸이 없다, #580 6번)
        지금은 모든 장소가 checks(「가게에 확인해 주세요」)에 들고 needs_check=true다.
      properties:
        id: { type: string }
        map_id: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        outcome:
          type: [string, "null"]
          enum: [solved, solved_with_checks, unresolved, timeout, null]
          description: "done일 때만. solved=위반·확인 필요 없음, solved_with_checks=확정 위반 없음·확인 필요 남음, unresolved=확정 위반이 남음(violations), timeout=시간 초과. 영업시간을 모르는 동안은 보통 solved_with_checks"
        failure_code:
          type: [string, "null"]
          enum: [INTERRUPTED, ENGINE_ERROR, null]
          description: "failed일 때만. INTERRUPTED=서버가 다시 떠서 끊김(또는 15분 넘게 끝나지 않음), ENGINE_ERROR=계산 오류. 화면은 같은 문구 「코스를 만들지 못했어요」 + 「다시 짜기」"
        goals: { type: array, items: { $ref: "#/components/schemas/CourseGoal" }, description: "요청 한 줄에서 모델이 세우고 코드가 검증한 목표. 요청이 없으면 빈 배열" }
        unmatched: { type: array, items: { type: string }, description: "목표로 바꾸지 못한 요청 조각(요청 원문의 일부). 화면에 「반영하지 못했어요」로 보인다" }
        steps: { type: array, items: { $ref: "#/components/schemas/CourseStep" }, description: "작업 기록 — 이해, 확인, 짜기, 점검, 재계획, 끝, 결과 순으로 누가 했는지와 함께. running 중에도 단계마다 늘어난다(앞 단계는 바뀌지 않고 뒤로만 붙는다). 그동안 goals, days 같은 결과 칸은 비어 있다" }
        days: { type: array, items: { $ref: "#/components/schemas/CourseDay" }, description: "지도 기간의 날짜별 순서(최대 14일). 날짜 하나가 비어 있을 수 있다" }
        violations: { type: array, items: { $ref: "#/components/schemas/CourseViolation" }, description: "남은 확정 위반(쉬는 날, 도보 상한 초과). 비어 있어야 정상이다" }
        checks: { type: array, items: { $ref: "#/components/schemas/CourseCheck" }, description: "그날 영업하는지 알 수 없는 장소 — 「가게에 직접 확인해 주세요」" }
        excluded: { type: array, items: { $ref: "#/components/schemas/CourseExcluded" }, description: "코스에서 빠진 확정 핀(좌표를 알 수 없는 실시간 핀, 30곳을 넘은 핀)" }
        snapshot_at: { type: string, format: date-time }
        stale: { type: boolean, description: "요청 뒤 확정 리스트가 바뀌었다 — 「확정 리스트가 바뀌었어요」 + 「다시 짜기」" }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    CourseGoal:
      type: object
      required: [id, kind, label, met]
      properties:
        id: { type: string, description: "예: day_indoor:d2" }
        kind: { type: string, enum: [day_indoor, night_end, daily_walk_low, day_light, place_on_day, together, day_has], description: "day_has = 그 날 코스에 공연·전시·야경 같은 종류의 장소가 하나 이상(종류는 코드의 고정 목록, 화면에는 label로만 보인다)" }
        label: { type: string, description: "예: 「둘째 날 (화)은 실내 위주로」 「둘째 날 (화)에 공연 장소 넣기」" }
        met: { type: [boolean, "null"], description: "지켜졌나. null = 판단할 수 없다(라벨을 아는 장소가 없다) — 「확인할 수 없어요」" }

    CourseStep:
      type: object
      required: [stage, role, by, by_detail, text]
      properties:
        stage: { type: string, description: "이해 · 확인 · 짜기 · 점검 · 재계획 · 다시 짜기 · 고정 · 검증 · 질문 · 답 · 대행 · 끝 · 결과" }
        role: { type: string, enum: [해석, 지휘, 계산, 검증, 결정], description: "무슨 일이었나. 해석=요청을 목표로, 지휘=도구 고르기·점검·끝, 계산=최적화·수리, 검증=코드가 사실과 맞춰 봄(모델 문장을 코드 문장으로 바꾼 기록 포함), 결정=사람의 답 또는 기본값" }
        by: { type: string, enum: [ai, code, human], description: "누가 했나. 칩으로 보여 준다. 여럿이 함께한 단계는 대표값(사람 > 모델 > 코드)이고 자세한 말은 by_detail" }
        by_detail: { type: [string, "null"], description: "섞인 단계의 원문. 예: 「모델 → 코드」, 「코드가 열고 모델이 고름 → 사람」, 「코드(목표 세우기 실패)」. 단순하면 null" }
        text: { type: string }

    CourseDay:
      type: object
      required: [date, slots, legs]
      properties:
        date: { type: string, format: date }
        slots: { type: array, items: { $ref: "#/components/schemas/CourseSlot" } }
        legs: { type: array, items: { $ref: "#/components/schemas/CourseLeg" }, description: "그날 장소 사이 구간. slots보다 하나 적다" }

    CourseSlot:
      type: object
      required: [pin_id, order, needs_check]
      properties:
        pin_id: { type: string, description: "확정 리스트의 핀. 이름과 좌표는 핀 응답(GET /maps/{mapId}/shortlist)에서 읽는다" }
        order: { type: integer, minimum: 1, description: "그날의 방문 순서(1부터)" }
        needs_check: { type: boolean, description: "그날 영업하는지 알 수 없다 — checks에도 있다" }

    CourseLeg:
      type: object
      required: [from_pin_id, to_pin_id, mode, approx_minutes]
      properties:
        from_pin_id: { type: string }
        to_pin_id: { type: string }
        mode: { type: string, enum: [walk, transit], description: "이동 방식. 직선거리 2km 이하는 walk(도보), 넘으면 transit(대중교통). 서버 상수라 대중교통 계산을 다듬으면(#685) 기준이 바뀔 수 있다" }
        approx_minutes: { type: integer, minimum: 0, description: "mode 기준 대략 분 — walk면 도보 분, transit이면 대중교통 약 분(직선거리로 잰 거친 추정). 길 안내·시간표가 아니다. 화면에는 「도보 N분」「대중교통 약 N분」으로 쓴다" }

    CourseViolation:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [closed, travel, member] }
        text: { type: string }

    CourseCheck:
      type: object
      required: [pin_id, text]
      properties:
        pin_id: { type: string }
        text: { type: string, description: "예: 「○○미술관은 첫째 날 (월)에 영업하는지 알 수 없어요. 가게에 직접 확인해 주세요」" }

    CourseExcluded:
      type: object
      required: [pin_id, reason, text]
      properties:
        pin_id: { type: string }
        reason: { type: string, enum: [NO_COORDINATES, OVER_LIMIT] }
        text: { type: string }

    # ---------- SSE 이벤트 (docs/events.md가 정본) ----------
    SseEnvelope:
      type: object
      description: "모든 SSE 이벤트의 공통 봉투. id는 event_log.seq와 같고 SSE의 id: 필드로 전송된다"
      required: [id, event, data]
      properties:
        id: { type: integer, format: int64, description: "= event_log.seq" }
        event: { type: string }

    PublicEvent:
      description: 전체 채널 이벤트 (docs/events.md). event 값으로 data 타입이 갈린다
      oneOf:
        - $ref: "#/components/schemas/EvtPinCreated"
        - $ref: "#/components/schemas/EvtPinPublished"
        - $ref: "#/components/schemas/EvtPinDeleted"
        - $ref: "#/components/schemas/EvtPinUpdated"
        - $ref: "#/components/schemas/EvtReactionChanged"
        - $ref: "#/components/schemas/EvtShortlistChanged"
        - $ref: "#/components/schemas/EvtRouteRecalculated"
        - $ref: "#/components/schemas/EvtMemberJoined"
        - $ref: "#/components/schemas/EvtMemberLeft"
        - $ref: "#/components/schemas/EvtMapDeleted"
        - $ref: "#/components/schemas/EvtMapUpdated"
        - $ref: "#/components/schemas/EvtOwnerChanged"
        - $ref: "#/components/schemas/EvtAgentSuggested"
        - $ref: "#/components/schemas/EvtAgentResolved"
        - $ref: "#/components/schemas/EvtAgentSummaryUpdated"
        - $ref: "#/components/schemas/EvtAgentSettingsChanged"
        - $ref: "#/components/schemas/EvtMemberPresence"

    PrivateEvent:
      description: 개인 채널 이벤트 (docs/events.md, 5-5-1)
      oneOf:
        - $ref: "#/components/schemas/EvtRunProgress"
        - $ref: "#/components/schemas/EvtRunCandidatesReady"
        - $ref: "#/components/schemas/EvtRunFailed"

    EvtPinCreated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.created" }
            data: { $ref: "#/components/schemas/Pin" }

    EvtPinPublished:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.published" }
            data: { $ref: "#/components/schemas/Pin" }

    EvtPinUpdated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.updated" }
            data: { $ref: "#/components/schemas/Pin" }

    EvtPinDeleted:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.deleted" }
            data:
              type: object
              required: [pin_id]
              properties:
                pin_id: { type: string }

    EvtReactionChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "reaction.changed" }
            data:
              type: object
              required: [pin_id, reaction_summary]
              properties:
                pin_id: { type: string }
                reaction_summary:
                  type: object
                  properties:
                    like: { type: integer }
                    against: { type: integer }

    EvtShortlistChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "shortlist.changed" }
            data:
              type: object
              required: [item, action]
              properties:
                item: { $ref: "#/components/schemas/ShortlistItem" }
                action: { type: string, enum: [added, removed, reordered], description: "reordered는 수동 정렬 (#30)" }

    EvtRouteRecalculated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "route.recalculated" }
            data:
              type: array
              items: { $ref: "#/components/schemas/Route" }

    EvtMemberJoined:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "member.joined" }
            data: { $ref: "#/components/schemas/Member" }

    EvtMemberLeft:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "member.left" }
            data:
              type: object
              required: [map_id, user_id, new_owner_user_id]
              properties:
                map_id: { type: string }
                user_id: { type: string }
                new_owner_user_id: { type: [string, "null"] }

    EvtMapDeleted:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "map.deleted" }
            data:
              type: object
              required: [map_id]
              properties:
                map_id: { type: string }

    EvtMapUpdated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "수정 직후 값. 요청자와 무관한 필드만 싣는다(permissions 등 요청자 기준 값은 없다) — 받은 FE는 지도 상세를 다시 불러와도 된다 (#465)"
          properties:
            event: { const: "map.updated" }
            data:
              type: object
              required: [map_id, title, start_date, end_date]
              properties:
                map_id: { type: string }
                title: { type: string, maxLength: 100 }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                region: { $ref: "#/components/schemas/MapRegion" }

    EvtOwnerChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "방장을 직접 넘겼다 (#468). member.left와 달리 두 사람 모두 지도에 남아 SSE 구독이 끊기지 않는다"
          properties:
            event: { const: "owner.changed" }
            data:
              type: object
              required: [map_id, from_user_id, to_user_id]
              properties:
                map_id: { type: string }
                from_user_id: { type: string }
                to_user_id: { type: string }

    EvtAgentSuggested:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "지도 제안이 새로 생김 (v2, docs/agent-v2.md 15절). 받은 FE는 지금 제안을 바꾸고, 시트가 열려 있으면 바로 view를 부르고 닫혀 있으면 점을 켠다"
          properties:
            event: { const: "agent.suggested" }
            data: { $ref: "#/components/schemas/AgentSuggestion" }

    EvtAgentResolved:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "제안이 끝남 — 수락, 닫기, 만료, 무효화 (v2). 누가 처리했는지는 싣지 않는다. 받은 FE는 id가 같으면 지금 제안을 비우고 점을 끈다"
          properties:
            event: { const: "agent.resolved" }
            data:
              type: object
              required: [suggestion_id, status, resolved_action_type]
              properties:
                suggestion_id: { type: string }
                status: { type: string, enum: [accepted, dismissed, expired, superseded] }
                resolved_action_type: { type: [string, "null"], description: "accepted일 때 누른 버튼의 AgentAction.type, 그 밖에는 null" }

    EvtAgentSummaryUpdated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "우리 조건 요약이 갱신됨 (v2). 점이나 알림은 켜지 않는다. 받은 FE는 그 카테고리 요약을 갈아끼운다"
          properties:
            event: { const: "agent.summary_updated" }
            data: { $ref: "#/components/schemas/AgentSummary" }

    EvtAgentSettingsChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          description: "모드가 바뀜 (v2). 누가 바꿨는지 구성원 모두에게 알리려고 updated_by를 싣는다. 표시 이름은 FE가 구성원 목록에서 찾는다"
          properties:
            event: { const: "agent.settings_changed" }
            data:
              type: object
              required: [enabled, updated_by]
              properties:
                enabled: { type: boolean }
                updated_by: { type: string }

    EvtMemberPresence:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "member.presence" }
            data:
              type: object
              required: [user_id, online]
              properties:
                user_id: { type: string }
                online: { type: boolean }

    EvtRunProgress:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.progress" }
            data:
              type: object
              required: [run_id, step, label]
              properties:
                run_id: { type: string }
                step: { type: integer, minimum: 1, maximum: 8, description: "추천 8단계 (기획안 3절, 6절)" }
                label: { type: string }

    EvtRunCandidatesReady:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.candidates_ready" }
            data:
              type: object
              required: [run_id, candidates]
              properties:
                run_id: { type: string }
                candidates:
                  type: array
                  items: { $ref: "#/components/schemas/Candidate" }

    EvtRunFailed:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.failed" }
            data:
              type: object
              required: [run_id, error]
              properties:
                run_id: { type: string }
                error: { $ref: "#/components/schemas/Error" }
