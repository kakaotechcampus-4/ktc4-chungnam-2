openapi: 3.1.0
info:
  title: pingo API
  version: 0.1.0
  description: |
    여행 공동 지도 API 계약. 정본은 이 파일이며 `최종기획안.md`의 절 번호를 각 엔드포인트 설명에 인용한다.
    변경 시 반드시 docs/CHANGELOG-api.md에 기록하고 프론트 담당자에게 통보한다 (CLAUDE.md 참고).
    security가 전역이므로 모든 엔드포인트는 401 UNAUTHORIZED를 반환할 수 있다.
    개별 엔드포인트에는 그 엔드포인트 고유의 에러만 명시한다.
servers:
  - url: https://api.pingo.example.com
    description: 배포 시 Cloud Run URL로 교체

security:
  - cookieAuth: []

tags:
  - name: auth
  - name: maps
  - name: pins
  - name: recommend
  - name: shortlist
  - name: realtime
    description: 서버→클라이언트 SSE 채널. 이벤트 페이로드의 정본은 docs/events.md

paths:
  # ---------- auth ----------
  /auth/kakao/callback:
    get:
      tags: [auth]
      summary: 카카오 OAuth 콜백. httpOnly 쿠키 발급 (13절 "토큰을 프론트에 두지 않는다")
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: 로그인 성공 시 진입점으로 리다이렉트 }

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      responses: { "204": { description: 로그아웃됨 } }

  /auth/withdraw:
    post:
      tags: [auth]
      summary: 탈퇴. 연결된 사유·반응 기록도 함께 삭제 (12절)
      responses: { "204": { description: 탈퇴 처리됨 } }

  # ---------- maps ----------
  /maps:
    post:
      tags: [maps]
      summary: 지도 생성. 생성 시 seeding 잡을 트리거한다 (architecture.md 3절)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MapCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }

  /maps/{mapId}:
    get:
      tags: [maps]
      summary: 지도 상세 조회
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }

  /maps/{mapId}/invite:
    post:
      tags: [maps]
      summary: 초대 링크 발급
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }

  /invites/{token}/accept:
    post:
      tags: [maps]
      summary: 초대 수락. 로그인 전 접근 시 처리 방식은 결정 이슈 미결 (#15 분리분)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Map" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /maps/{mapId}/members:
    get:
      tags: [maps]
      summary: 구성원 목록 (color, online) — 5절 "구성원 배지 + 목록"
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }

  # ---------- pins ----------
  /maps/{mapId}/pins:
    get:
      tags: [pins]
      summary: 핀 목록. 보는 사람 기준 필터링 — visibility=private인 남의 후보는 내려주지 않는다 (5-5-1)
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PinKind" }
        - name: created_by
          in: query
          description: "구성원별 핀 필터 (#26). 여러 명을 지정하면 OR로 묶는다"
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pin" }
    post:
      tags: [pins]
      summary: 핀 생성 (링크·검색·좌표 3경로, 5-9의 대량 버전은 v2)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinCreateRequest" }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "409": { $ref: "#/components/responses/PinDuplicate" }

  /maps/{mapId}/counts:
    get:
      tags: [pins]
      summary: 분류 × 종류 이중 필터 집계 (기획안 4절)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilterCounts" }

  /pins/{pinId}:
    delete:
      tags: [pins]
      summary: 핀 삭제. 권한 규정은 결정 이슈 미결 (#15 분리분)
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      responses: { "204": { description: 삭제됨 } }

  /pins/{pinId}/reaction:
    put:
      tags: [pins]
      summary: 반응 등록/수정. 반대(against)는 reason 필수 (가드레일 3)
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReactionRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }
        "422": { $ref: "#/components/responses/EvidenceRequired" }
    delete:
      tags: [pins]
      summary: 핀 되돌리기 — 구성원 누구나 가능 (15-1)
      parameters: [ { $ref: "#/components/parameters/PinId" } ]
      responses: { "204": { description: 반응 취소됨 } }

  # ---------- recommend (3절, 5-5~5-6-1) ----------
  /maps/{mapId}/recommend/readiness:
    get:
      tags: [recommend]
      summary: 카테고리별 추천 버튼 활성화 판정 (5-4)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/Readiness" }

  /maps/{mapId}/runs:
    post:
      tags: [recommend]
      summary: run 생성 — 근거 조립 시작 (①②)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: "#/components/schemas/Category" }
      responses:
        "202":
          description: run 생성됨, 근거 조립 진행 중 (SSE run.progress로 진행 상태 전달)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "409": { $ref: "#/components/responses/NotReady" }

  /runs/{runId}/evidence:
    get:
      tags: [recommend]
      summary: 근거 리스트 조회 (5-5)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceLine" }
    patch:
      tags: [recommend]
      summary: 근거 토글('-') / 직접 추가('+') (5-5). '-'는 author 본인만 (permissions.md)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidencePatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceLine" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /runs/{runId}/regions/confirm:
    post:
      tags: [recommend]
      summary: |
        지역 확인 (5-6-1). 사람이 쓴 반경 사유끼리 안 겹칠 때만 호출된다.
        signature가 이전과 같으면 재확인 없이 즉시 200. signature 변경(사유 수정/추가로 겹침 여부가 바뀜) 시에만 REGION_CONFLICT로 재확인 요구.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accept_union: { type: boolean, description: "두 지역 각각 찾기 선택 시 true" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Region" }
        "409": { $ref: "#/components/responses/RegionConflict" }

  /runs/{runId}/execute:
    post:
      tags: [recommend]
      summary: 「이대로 추천 받기」 — 실격 필터 + 선호 순위 실행 (③-a-2, ③-b, ④)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202":
          description: 실행 시작. 완료는 SSE run.progress(개인 채널) 또는 GET /runs/{id}/result 폴링
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "500": { $ref: "#/components/responses/RecommendFailed" }

  /runs/{runId}/result:
    get:
      tags: [recommend]
      summary: 추천 결과 조회 (funnel, regions, candidates) — 5-6 깔때기 표시
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendResult" }
        "404": { $ref: "#/components/responses/NoResults" }
        "500": { $ref: "#/components/responses/RecommendFailed" }

  /runs/{runId}/widen:
    post:
      tags: [recommend]
      summary: 반경 넓히기. 기본값 원만 확대한다 — 사람이 명시한 원(예 "숙소 기준 20분")은 자동으로 넓히지 않는다 (가드레일 4, 5-6-1)
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202": { description: 재실행 시작 }

  /runs/{runId}/retry:
    post:
      tags: [recommend]
      summary: |
        「다시 추천 받기」. 현재 뜬 대안 전체를 제외목록에 넣고 새로 찾는다 (3절, 루프가 닫힌다).
        3회 상한 초과 시 429 RETRY_LIMIT. 상한의 집계 단위는 결정 이슈 미결 — 응답의 attempt_no로 우선 노출.
      parameters: [ { $ref: "#/components/parameters/RunId" } ]
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendRun" }
        "429": { $ref: "#/components/responses/RetryLimit" }

  /candidates/{candidateId}/publish:
    post:
      tags: [recommend]
      summary: 「지도에 올리기」 — 비공개 후보를 전체 채널에 공개, 핀으로 전환 (5-5-1, 가드레일 1)
      parameters: [ { $ref: "#/components/parameters/CandidateId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        "404": { $ref: "#/components/responses/AiPinPrivate" }

  # ---------- shortlist (5-3, 5-10) ----------
  /maps/{mapId}/shortlist:
    get:
      tags: [shortlist]
      summary: 확정 리스트 조회
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShortlistItem" }
    post:
      tags: [shortlist]
      summary: 확정 추가 — 구성원 누구나 (5-3, 15-1)
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pin_id]
              properties:
                pin_id: { type: string }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShortlistItem" }

  /shortlist/{itemId}:
    delete:
      tags: [shortlist]
      summary: 확정 제외
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses: { "204": { description: 제외됨 } }

  /maps/{mapId}/shortlist/order:
    put:
      tags: [shortlist]
      summary: |
        확정 리스트 수동 정렬 (#30). 보기 좋게 순서를 바꾸는 것뿐이고 동선과는 무관하다.
        동선을 다시 짜려면 POST /maps/{mapId}/route를 부른다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  items: { type: string }
                  description: "원하는 순서대로 나열한 shortlist item id 전체"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShortlistItem" }

  /maps/{mapId}/route:
    get:
      tags: [shortlist]
      summary: |
        마지막으로 계산된 동선 조회 (5-10). 순수 계산, 모델 미사용.
        확정 핀이 여러 지역에 걸치면 지역별로 여러 동선을 반환한다.
        한 번도 계산하지 않았으면 빈 배열.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }
    post:
      tags: [shortlist]
      summary: |
        「동선 짜주기」 — 현재 확정 리스트로 동선을 계산한다 (#30, 기획안 5-10의 "동선 보기" 토글).
        확정 리스트가 바뀌어도 자동 재계산하지 않는다. 사람이 이 버튼을 눌러야 실행된다.
      parameters: [ { $ref: "#/components/parameters/MapId" } ]
      responses:
        "200":
          description: 계산된 동선. 같은 결과를 route.recalculated로도 발행한다
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }

  # ---------- realtime (SSE, docs/events.md가 정본) ----------
  /maps/{mapId}/events:
    get:
      tags: [realtime]
      summary: |
        전체 채널 SSE. 지도의 모든 구성원이 구독한다.
        visibility=private인 핀·후보는 이 채널로 절대 내려가지 않는다 (5-5-1, 가드레일 1).
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - { $ref: "#/components/parameters/LastEventId" }
      responses:
        "200":
          description: 전체 채널 이벤트 스트림
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PublicEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /maps/{mapId}/events/me:
    get:
      tags: [realtime]
      summary: |
        개인 채널 SSE. 요청자 본인만 구독한다. 본인의 비공개 AI 후보와 run 진행 상태가 여기로만 온다.
        채널 분리가 5-5-1을 if문이 아니라 구조로 강제한다.
      parameters:
        - { $ref: "#/components/parameters/MapId" }
        - { $ref: "#/components/parameters/LastEventId" }
      responses:
        "200":
          description: 개인 채널 이벤트 스트림
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PrivateEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    MapId: { name: mapId, in: path, required: true, schema: { type: string } }
    PinId: { name: pinId, in: path, required: true, schema: { type: string } }
    RunId: { name: runId, in: path, required: true, schema: { type: string } }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string } }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        브라우저 EventSource가 재연결 시 자동으로 보낸다. 이 seq 이후 이벤트만 재전송한다.
        event_log 보존기간을 넘긴 값이면 REST 재조회로 폴백한다 (docs/events.md).
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PinDuplicate:
      description: 이미 지도에 있는 장소 (가드레일 6)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EvidenceRequired:
      description: 반대 반응에 사유가 없음 (가드레일 3)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoResults:
      description: 필터 통과 후보 0개 (6절 "결과 0개")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RetryLimit:
      description: 재시도 3회 초과 (6절 "재시도 3회 초과")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RegionConflict:
      description: 두 반경 사유가 겹치지 않음 — 사용자 확인 필요 (5-6-1)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AiPinPrivate:
      description: 비공개 AI 후보에 요청자 본인이 아닌 사람이 접근 (5절 "비공개 AI 핀 접근 시 안내")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: 추천 준비 미달 — 해당 카테고리에 의견 남긴 핀이 기준 미달 (5-4, "핀 1/2 · 1개 더 필요")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        권한 없는 액션 (docs/permissions.md 범위 밖).
        이 응답이 화면에 보이면 버튼이 애초에 disabled였어야 했다는 신호다.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RecommendFailed:
      description: 추천 파이프라인 실패 (6절 "조건이 까다로워서가 아니에요")
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: 동일 Idempotency-Key로 다른 바디를 보냄 — 재시도 로직 버그 신호. 붙일 엔드포인트는 #48 결정에 따름
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: 공통 에러 포맷. 코드 카탈로그는 docs/errors.md
      required: [code, message]
      properties:
        code: { type: string, example: "PIN_DUPLICATE" }
        message: { type: string }
        detail: { type: object, additionalProperties: true }

    Category:
      type: string
      enum: [음식점, 카페, 숙소, 관광지]

    PinKind:
      type: string
      enum: [일반, AI추천, 확정]
      description: 핀 종류는 이 3가지뿐 (기획안 9절). 확정이 나머지 둘을 덮어쓴다.

    Permissions:
      type: object
      description: 요청자 기준 계산된 권한. FE는 이 값만 보고 버튼을 그린다 (permissions.md)
      properties:
        can_react: { type: boolean }
        can_revert: { type: boolean }
        can_add_to_shortlist: { type: boolean }
        can_remove_from_shortlist: { type: boolean }
        can_disable: { type: boolean, description: "evidence_line 전용: 자기가 쓴 것만 true" }
        can_delete: { type: boolean }

    User:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }

    Map:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        start_date: { type: string, format: date, description: "여행 시작일 (#22)" }
        end_date: { type: string, format: date, description: "여행 종료일 (#22)" }
        member_count: { type: integer }
        confirmed_count: { type: integer }

    Invite:
      type: object
      properties:
        token: { type: string }
        url: { type: string }
        expires_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        user_id: { type: string }
        display_name: { type: string }
        online: { type: boolean }

    MapCreateRequest:
      type: object
      required: [title, start_date, end_date]
      properties:
        title: { type: string, description: "여행 제목 (#22)" }
        start_date: { type: string, format: date, description: "여행 시작일 (#22)" }
        end_date: { type: string, format: date, description: "여행 종료일 (#22). start_date 이후여야 한다" }

    PinCreateRequest:
      type: object
      required: [category]
      properties:
        category: { $ref: "#/components/schemas/Category" }
        source: { type: string, enum: [link, search, coordinate] }
        link_url: { type: string }
        place_id: { type: string }
        lat: { type: number }
        lng: { type: number }

    PriceBucket:
      type: string
      enum: [low, mid, high]
      description: "docs/constraints.md 차원 압축 결과. 원본 가격 숫자는 API로 노출하지 않는다"

    LabelConfidence:
      type: string
      enum: [known, unknown]

    Check:
      type: object
      description: 가드레일 5 "조건별 충족 체크"
      properties:
        fact_key: { type: string }
        label: { type: string }
        passed: { type: boolean }
        confidence: { $ref: "#/components/schemas/LabelConfidence" }
        needs_check: { type: boolean, description: "unknown_policy=pass+needs_check인 취향 조건이 unknown일 때 true" }

    Pin:
      type: object
      properties:
        id: { type: string }
        map_id: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        kind: { $ref: "#/components/schemas/PinKind" }
        visibility: { type: string, enum: [public, private] }
        lat: { type: number }
        lng: { type: number }
        place_name: { type: string }
        created_by: { type: string, description: "핀을 찍은 구성원의 user_id (#26)" }
        created_by_display_name: { type: string, description: "핀 상세에서 '누가 찍었는지' 표시용 (#26)" }
        price_bucket:
          $ref: "#/components/schemas/PriceBucket"
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
          description: "게시된 AI 추천 핀도 상세에서 계속 노출한다 (가드레일 5)"
        source_run_id: { type: [string, "null"] }
        reaction_summary:
          type: object
          properties:
            like: { type: integer }
            neutral: { type: integer }
            against: { type: integer }
        permissions: { $ref: "#/components/schemas/Permissions" }

    ReactionRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [like, neutral, against] }
        reason_text: { type: string, maxLength: 140 }
        reason_chip_ids:
          type: array
          items: { type: string }

    Reaction:
      type: object
      properties:
        pin_id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [like, neutral, against] }
        reason_text: { type: string }

    FilterCounts:
      type: object
      properties:
        by_category:
          type: object
          additionalProperties: { type: integer }
        by_kind:
          type: object
          additionalProperties: { type: integer }

    Readiness:
      type: object
      properties:
        ready: { type: boolean }
        answered_count: { type: integer }
        required_count: { type: integer, description: "ceil(N/2). N의 정의는 결정 이슈 미결" }

    EvidenceLine:
      type: object
      properties:
        id: { type: string }
        author_id: { type: string }
        author_display_name: { type: string }
        text: { type: string }
        badge: { type: string, enum: [required, preferred, reference], description: "꼭/선호/참고 (5-5)" }
        fact_key: { type: [string, "null"] }
        is_active: { type: boolean }
        permissions: { $ref: "#/components/schemas/Permissions" }

    EvidencePatchRequest:
      type: object
      properties:
        toggle:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              is_active: { type: boolean }
        add:
          type: array
          items:
            type: object
            properties:
              text: { type: string }

    Region:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        signature: { type: string }
        confirmed: { type: boolean }

    RecommendRun:
      type: object
      properties:
        id: { type: string }
        map_id: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        status: { type: string, enum: [collecting_evidence, awaiting_region_confirm, executing, done, failed] }
        attempt_no: { type: integer }

    Candidate:
      type: object
      properties:
        id: { type: string }
        place_name: { type: string }
        region_label: { type: string, description: "5-6-1 지역별 안배 태그" }
        rank: { type: integer }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        visibility: { type: string, enum: [private, published] }
        published_pin_id: { type: [string, "null"] }

    RecommendResult:
      type: object
      properties:
        run_id: { type: string }
        funnel:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              removed_count: { type: integer }
          description: "5-6 깔때기 표"
        regions:
          type: array
          items: { $ref: "#/components/schemas/Region" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }

    ShortlistItem:
      type: object
      properties:
        id: { type: string }
        pin: { $ref: "#/components/schemas/Pin" }
        visit_order: { type: [integer, "null"] }
        added_by: { type: string }
        permissions: { $ref: "#/components/schemas/Permissions" }

    Route:
      type: object
      properties:
        region_label: { type: string }
        ordered_pin_ids:
          type: array
          items: { type: string }
        total_distance_m: { type: number }
        legs:
          type: array
          items:
            type: object
            properties:
              from_pin_id: { type: string }
              to_pin_id: { type: string }
              distance_m: { type: number }
              approx_minutes: { type: integer }

    # ---------- SSE 이벤트 (docs/events.md가 정본) ----------
    SseEnvelope:
      type: object
      description: "모든 SSE 이벤트의 공통 봉투. id는 event_log.seq와 같고 SSE의 id: 필드로 전송된다"
      required: [id, event, data]
      properties:
        id: { type: integer, format: int64, description: "= event_log.seq" }
        event: { type: string }

    PublicEvent:
      description: 전체 채널 이벤트 (docs/events.md). event 값으로 data 타입이 갈린다
      oneOf:
        - $ref: "#/components/schemas/EvtPinCreated"
        - $ref: "#/components/schemas/EvtPinPublished"
        - $ref: "#/components/schemas/EvtPinDeleted"
        - $ref: "#/components/schemas/EvtReactionChanged"
        - $ref: "#/components/schemas/EvtShortlistChanged"
        - $ref: "#/components/schemas/EvtRouteRecalculated"
        - $ref: "#/components/schemas/EvtMemberJoined"
        - $ref: "#/components/schemas/EvtMemberPresence"

    PrivateEvent:
      description: 개인 채널 이벤트 (docs/events.md, 5-5-1)
      oneOf:
        - $ref: "#/components/schemas/EvtRunProgress"
        - $ref: "#/components/schemas/EvtRunCandidatesReady"
        - $ref: "#/components/schemas/EvtRunFailed"

    EvtPinCreated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.created" }
            data: { $ref: "#/components/schemas/Pin" }

    EvtPinPublished:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.published" }
            data: { $ref: "#/components/schemas/Pin" }

    EvtPinDeleted:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "pin.deleted" }
            data:
              type: object
              required: [pin_id]
              properties:
                pin_id: { type: string }

    EvtReactionChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "reaction.changed" }
            data:
              type: object
              required: [pin_id, reaction_summary]
              properties:
                pin_id: { type: string }
                reaction_summary:
                  type: object
                  properties:
                    like: { type: integer }
                    neutral: { type: integer }
                    against: { type: integer }

    EvtShortlistChanged:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "shortlist.changed" }
            data:
              type: object
              required: [item, action]
              properties:
                item: { $ref: "#/components/schemas/ShortlistItem" }
                action: { type: string, enum: [added, removed, reordered], description: "reordered는 수동 정렬 (#30)" }

    EvtRouteRecalculated:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "route.recalculated" }
            data:
              type: array
              items: { $ref: "#/components/schemas/Route" }

    EvtMemberJoined:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "member.joined" }
            data: { $ref: "#/components/schemas/Member" }

    EvtMemberPresence:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "member.presence" }
            data:
              type: object
              required: [user_id, online]
              properties:
                user_id: { type: string }
                online: { type: boolean }

    EvtRunProgress:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.progress" }
            data:
              type: object
              required: [run_id, step, label]
              properties:
                run_id: { type: string }
                step: { type: integer, minimum: 1, maximum: 8, description: "추천 8단계 (기획안 3절, 6절)" }
                label: { type: string }

    EvtRunCandidatesReady:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.candidates_ready" }
            data:
              type: object
              required: [run_id, candidates]
              properties:
                run_id: { type: string }
                candidates:
                  type: array
                  items: { $ref: "#/components/schemas/Candidate" }

    EvtRunFailed:
      allOf:
        - $ref: "#/components/schemas/SseEnvelope"
        - type: object
          required: [event, data]
          properties:
            event: { const: "run.failed" }
            data:
              type: object
              required: [run_id, error]
              properties:
                run_id: { type: string }
                error: { $ref: "#/components/schemas/Error" }
