name: images
# API와 화면 이미지를 만들어 팀 AWS 계정의 ECR에 올린다(#168, deploy_rules.md 「배포 구성」). 인증은 OIDC 역할 — 저장한 키가 없다.
# 서버는 자기 역할(인스턴스 프로필)로 ECR에서 받는다.
# 빌드와 배포를 나눈다: 이 워크플로는 만들기만 하고, develop일 때만 이어서 스테이징에 올린다(deploy.yml).
# 운영은 사람이 deploy.yml에서 v 태그를 골라 올린다.
# 태그: sha-<7자리>(모든 빌드), develop/main(브랜치), v0.x.y(git 태그).

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pingo-api
            dockerfile: backend/Dockerfile
          - image: pingo-web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 카카오 지도 JS 키는 브라우저에 그대로 나가는 값이라 비밀이 아니다(저장소 변수, 카카오 콘솔에서 도메인으로 제한)
          build-args: VITE_KAKAO_MAP_KEY=${{ vars.KAKAO_MAP_KEY }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  tag:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - id: sha
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [build, tag]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ needs.tag.outputs.short }}
    permissions:
      id-token: write
      contents: read
