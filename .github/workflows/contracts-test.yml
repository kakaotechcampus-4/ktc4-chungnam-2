name: contracts-test

# FE↔BE 계약 패키지(타입 생성 + 목 서버) 검증. develop 필수 검사다(#278) — 실패하면 PR이 머지되지 않는다.
# PR에서는 항상 시작하고, 관련 파일이 안 바뀌었으면 contracts job을 건너뛴다. 필수 검사가 경로 필터로
# 아예 시작되지 않으면 PR이 "대기 중"으로 멈추기 때문이다(건너뛴 job은 통과로 보고된다).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    paths: ["contracts/**", "docs/api-spec.yaml"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name == 'push' || steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - "contracts/**"
              - "docs/api-spec.yaml"
              - ".github/workflows/contracts-test.yml"

  contracts:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      # 스펙을 고치고 타입을 다시 만들지 않으면 FE가 낡은 타입을 쓴다 — 생성 결과가 커밋된 파일과 같아야 한다.
      - run: npm run gen:types
      - run: git diff --exit-code -- src/types/api.d.ts
      - run: npm run typecheck
      - run: npm test
