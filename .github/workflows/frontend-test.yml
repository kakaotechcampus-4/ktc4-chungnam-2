name: frontend-test

# 프론트 lint + 타입 검사 + 빌드(#310, 멘토 리뷰 #94 "빌드 테스트를 PR마다"). develop 필수 검사다 — 실패하면 PR이 머지되지 않는다.
# frontend 는 ../contracts 의 생성 타입·목 서버를 경로로 불러오므로 스펙·contracts 가 바뀌어도 돈다.
# PR에서는 항상 시작하고 관련 파일이 안 바뀌었으면 job을 건너뛴다 — 필수 검사가 경로 필터로 아예 시작되지
# 않으면 PR이 "대기 중"으로 멈추기 때문이다(건너뛴 job은 통과로 보고된다, contracts-test 와 같은 방식 #278).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    paths: ["frontend/**", "contracts/**", "docs/api-spec.yaml"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name == 'push' || steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - "frontend/**"
              - "contracts/**"
              - "docs/api-spec.yaml"
              - ".github/workflows/frontend-test.yml"

  frontend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            frontend/package-lock.json
      # frontend 가 ../contracts 의 타입·목 서버를 경로로 불러온다 — contracts 의존성이 먼저 있어야 한다.
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
