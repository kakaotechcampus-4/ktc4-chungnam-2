name: backend-test

# 백엔드 전체 pytest(모듈 단위 + backend/integration). develop 필수 검사다(#278) — 실패하면 PR이 머지되지 않는다.
# PR에서는 항상 시작하고, 관련 파일이 안 바뀌었으면 pytest job을 건너뛴다(건너뛴 job은 통과로 보고된다).
# 테스트가 직접 읽어 코드와 대조하는 문서(constraints.md, permissions.md, errors.md, api-spec.yaml)도 관련 파일이다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    paths: ["backend/**", "docs/api-spec.yaml", "docs/constraints.md", "docs/permissions.md", "docs/errors.md"]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name == 'push' || steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run:
              - "backend/**"
              - "docs/api-spec.yaml"
              - "docs/constraints.md"
              - "docs/permissions.md"
              - "docs/errors.md"
              - ".github/workflows/backend-test.yml"

  pytest:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pingo
          POSTGRES_PASSWORD: pingo
          POSTGRES_DB: pingo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pingo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PINGO_ENV: test
      DATABASE_URL: postgresql://pingo:pingo@localhost:5432/pingo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # PostGIS 익스텐션은 이미지에 있고, 스키마는 마이그레이션 체인으로 만든다 — 앱 lifespan이 event_log를 읽기 때문에
      # 마이그레이션 없이는 TestClient가 뜨지 않는다. 체인이 깨졌는지(다중 head 등)도 여기서 잡힌다.
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
