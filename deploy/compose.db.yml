# 서버 안의 PostgreSQL(PostGIS) — RDS가 승인되기 전까지의 타협이다(deploy_rules.md 「타협과 다시 볼 조건」).
# 운영과 스테이징은 DB 이름으로 나눈다(pingo_prod, pingo_staging). 바깥 포트는 열지 않는다(같은 compose 네트워크에서만).
# RDS로 옮기면 .env의 COMPOSE_FILE에서 이 파일을 빼고, env/*.env의 DATABASE_URL을 RDS 주소로 바꾼다.
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: [./env/db.env]   # POSTGRES_USER, POSTGRES_PASSWORD
    # 서버 4GB를 API 두 환경과 나눠 쓴다. 연결 수 = 환경 둘 × 프로세스 하나 × 풀(기본 15) + 작업 여유
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
